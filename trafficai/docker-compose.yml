version: '3.8'

services:

  backend:
    build: ./backend
    container_name: trafficai-backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.trafficai-api.rule=Host(`api.alfamaxdigital.com.br`)"
      - "traefik.http.routers.trafficai-api.entrypoints=websecure"
      - "traefik.http.routers.trafficai-api.tls.certresolver=myresolver"
      - "traefik.http.services.trafficai-api.loadbalancer.server.port=3001"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.trafficai-api-http.rule=Host(`api.alfamaxdigital.com.br`)"
      - "traefik.http.routers.trafficai-api-http.entrypoints=web"
      - "traefik.http.routers.trafficai-api-http.middlewares=redirect-to-https@file"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.alfamaxdigital.com.br/api/v1
    container_name: trafficai-frontend
    restart: unless-stopped
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.trafficai-app.rule=Host(`app.alfamaxdigital.com.br`)"
      - "traefik.http.routers.trafficai-app.entrypoints=websecure"
      - "traefik.http.routers.trafficai-app.tls.certresolver=myresolver"
      - "traefik.http.services.trafficai-app.loadbalancer.server.port=3002"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.trafficai-app-http.rule=Host(`app.alfamaxdigital.com.br`)"
      - "traefik.http.routers.trafficai-app-http.entrypoints=web"
      - "traefik.http.routers.trafficai-app-http.middlewares=redirect-to-https@file"

networks:
  traefik_net:
    external: true
    name: n8n_default
