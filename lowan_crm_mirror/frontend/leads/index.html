    @keyframes detAiPulse { 0%,100% { box-shadow: 0 0 0 3px currentColor; opacity: 0.85 } 50% { box-shadow: 0 0 0 5px transparent; opacity: 1 } }

    .det-ai-status.s-auto    { background: color-mix(in srgb, #10b981 12%, transparent); color: #047857; }
    .det-ai-status.s-paused  { background: color-mix(in srgb, #f59e0b 14%, transparent); color: #92400e; }
    .det-ai-status.s-forced  { background: color-mix(in srgb, #8b5cf6 14%, transparent); color: #6d28d9; }
    .det-ai-status.s-handoff { background: color-mix(in srgb, #64748b 14%, transparent); color: #475569; }

    .det-ai-desc { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

    .det-ai-actions { display: flex; gap: 6px; margin-top: 10px; }
    .det-ai-act { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all 0.14s var(--bc-easing); font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .det-ai-act svg { width: 12px; height: 12px; opacity: 0.75; }
    .det-ai-act:hover { border-color: var(--border-2); background: var(--surface-2); color: var(--text-primary); }
    .det-ai-act.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .det-ai-act.primary:hover { background: color-mix(in srgb, var(--accent) 90%, #000); border-color: color-mix(in srgb, var(--accent) 90%, #000); }
    .det-ai-act.danger { color: #b91c1c; }
    .det-ai-act.danger:hover { background: color-mix(in srgb, #ef4444 8%, transparent); border-color: color-mix(in srgb, #ef4444 30%, var(--border)); color: #991b1b; }
    .det-ai-act.ghost { background: transparent; }

    .det-ai-loading { display: flex; align-items: center; gap: 8px; padding: 10px 0; color: var(--text-muted); font-size: 11.5px; }
    .det-ai-loading::before { content: ''; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    

    /* Stage dropdown estilizado como det-pill quando dentro do painel de detalhes */
    .det-cdd .cdd-btn { height: auto; padding: 5px 10px 5px 11px; gap: 6px; border-radius: 100px; font-size: 12px; font-weight: 500; border: 1px solid transparent !important; background: var(--surface-2) !important; color: var(--text-secondary) !important; transition: all 0.14s var(--bc-easing); }
    .det-cdd .cdd-btn:hover { border-color: var(--border-2) !important; background: var(--surface) !important; color: var(--text-primary) !important; }

    .det-cdd .cdd-arr { width: 10px; height: 10px; opacity: 0.5; color: currentColor; }
    .det-cdd .cdd-btn:hover .cdd-arr { opacity: 0.8; }
    .det-cdd .cdd-drop { min-width: 180px; }

    .det-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .det-row-icon { width: 28px; height: 28px; border-radius: 7px; background: var(--surface-2); color: var(--text-secondary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .det-row-icon svg { width: 14px; height: 14px; }
    .det-row-info { flex: 1; min-width: 0; }
    .det-row-key { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 1px; }
    .det-row-val { font-size: 13px; color: var(--text-primary); font-weight: 500; word-break: break-word; }
    .det-row-val.num-val { font-family: 'JetBrains Mono', monospace; }
    .det-copy { width: 26px; height: 26px; border-radius: 6px; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: all 0.14s var(--bc-easing); background: transparent; border: none; flex-shrink: 0; }
    .det-row:hover .det-copy { opacity: 1; }
    .det-copy:hover { background: var(--surface-2); color: var(--accent); }
    .det-copy svg { width: 13px; height: 13px; }

    .det-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 100px; font-size: 11.5px; font-weight: 500; background: var(--accent-soft); color: var(--accent); margin: 0 4px 4px 0; }
    .det-tag .x { width: 12px; height: 12px; cursor: pointer; opacity: 0.5; background: transparent; border: none; padding: 0; color: inherit; display: inline-flex; align-items: center; justify-content: center; }
    .det-tag .x:hover { opacity: 1; }
    .det-tag .x svg { width: 10px; height: 10px; }
    .det-tag.tg { background: var(--brand-tg-soft); color: var(--brand-tg); }
    .det-tag-add { padding: 3px 10px; border-radius: 100px; border: 1px dashed var(--border-2); color: var(--text-muted); font-size: 11.5px; cursor: pointer; transition: all 0.14s var(--bc-easing); background: transparent; font-family: inherit; }
    .det-tag-add:hover { color: var(--accent); border-color: var(--accent); border-style: solid; }

    .det-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .det-stat-card { padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
    .det-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 4px; }
    .det-stat-num { font-size: 18px; font-weight: 700; font-family: 'Bricolage Grotesque', serif; color: var(--text-primary); letter-spacing: -0.02em; line-height: 1; }

    .det-notes textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; font-family: inherit; font-size: 12.5px; color: var(--text-primary); resize: vertical; min-height: 60px; outline: none; background: var(--surface); transition: border-color 0.14s var(--bc-easing); box-sizing: border-box; line-height: 1.5; }
    .det-notes textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .det-notes-hint { font-size: 10.5px; color: var(--text-muted); margin: 4px 0 0; }

    /* Financeiro — refinado */
    .fin-hero { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; position: relative; overflow: hidden; }
    .fin-hero::before { content: ""; position: absolute; top: 0; right: 0; width: 80px; height: 80px; background: radial-gradient(circle at top right, rgba(5,150,105,0.10) 0%, transparent 70%); pointer-events: none; }
    .fin-hero-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; position: relative; }
    .fin-hero-value { font-family: 'Bricolage Grotesque', serif; color: var(--bc-success); line-height: 1; letter-spacing: -0.025em; display: flex; align-items: baseline; gap: 4px; position: relative; }
    .fin-hero-currency { font-size: 14px; font-weight: 600; opacity: 0.7; }
    .fin-hero-num { font-size: 28px; font-weight: 800; font-family: 'Bricolage Grotesque', serif; }
    .fin-hero-decimal { font-size: 14px; font-weight: 600; opacity: 0.6; }
    .fin-hero-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; position: relative; }

    .fin-types { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; margin-bottom: 12px; }
    .fin-type { display: flex; align-items: center; gap: 9px; padding: 9px 12px; background: var(--surface); transition: background 0.12s var(--bc-easing); }
    .fin-type:hover { background: var(--surface-2); }
    .fin-type-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .fin-type-name { flex: 1; font-size: 12.5px; font-weight: 500; color: var(--text-primary); }
    .fin-type-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .fin-type.muted .fin-type-name { color: var(--text-secondary); }
    .fin-type.muted .fin-type-val { color: var(--text-muted); }

    .fin-add-row { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
    .fin-chip { padding: 5px 11px; border: 1px solid var(--border); border-radius: 100px; background: var(--surface); color: var(--text-secondary); font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all 0.14s var(--bc-easing); font-family: inherit; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fin-chip:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

    .fin-hist-link { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 0; background: transparent; border: none; color: var(--text-secondary); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; transition: color 0.14s var(--bc-easing); }
    .fin-hist-link:hover { color: var(--accent); }
    .fin-hist-link svg { width: 13px; height: 13px; }
    .fin-hist-link svg:last-child { margin-left: auto; opacity: 0.5; }
    .fin-hist-link:hover svg:last-child { opacity: 1; }

    /* Atividade — timeline */
    .det-timeline { display: flex; flex-direction: column; gap: 0; }
    .det-event { display: flex; gap: 10px; font-size: 11.5px; padding: 4px 0 14px; position: relative; }
    .det-event:last-child { padding-bottom: 2px; }
    .det-event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; position: relative; background: var(--text-muted); }
    .det-event-dot::after { content: ""; position: absolute; left: 50%; top: 12px; bottom: -14px; width: 1.5px; background: var(--surface-3); transform: translateX(-50%); }
    .det-event:last-child .det-event-dot::after { display: none; }
    .det-event-dot.success { background: var(--bc-success); }
    .det-event-dot.accent { background: var(--accent); }
    .det-event-dot.warning { background: var(--bc-warning); }
    .det-event-dot.tg { background: var(--brand-tg); }
    .det-event-info { flex: 1; min-width: 0; }
    .det-event-text { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
    .det-event-text strong { color: var(--text-primary); font-weight: 600; }
    .det-event-text code { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--text-primary); }
    .det-event-time { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    /* ═══════════════════════════════════════════════════════════════════
       CONFIGURAÇÕES — redesign (Equipe, Tags, Modelos, Financeiro, API)
       Prefixos: cfg- (cards genéricos), qcard- (quick stats), team- (equipe),
                 tag-bigchip- (tags), tpl- (modelos), fin- (financeiro),
                 curl- (cURL banner), int- (integrações)

    /* ── Page header reusável ── */
    .cfg-page-head { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }

    .cfg-page-eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.16em; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .cfg-page-eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .cfg-page-head h1 { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 32px; letter-spacing: -0.035em; line-height: 1; color: var(--text-primary); margin: 0 0 7px; }
    .cfg-page-head p { font-size: 13.5px; color: var(--text-muted); max-width: 540px; line-height: 1.55; margin: 0; }
    .cfg-page-head-cta { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    /* ── Botões reusáveis (config) ── */
    .cfg-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; font-size: 12.5px; font-weight: 600; border-radius: 9px; border: 1px solid transparent; transition: all .14s var(--bc-easing); white-space: nowrap; cursor: pointer; font-family: inherit; }
    .cfg-btn svg { width: 13px; height: 13px; }
    .cfg-btn-primary { background: linear-gradient(135deg, var(--accent), #6366f1); color: #fff; border-color: var(--accent); box-shadow: 0 6px 14px rgba(79,70,229,0.18); }

    .cfg-btn-secondary { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
    .cfg-btn-secondary:hover { background: var(--surface-2); border-color: var(--border-2); }
    .cfg-btn-ghost { background: transparent; color: var(--text-secondary); }
    .cfg-btn-ghost:hover { background: var(--surface-2); color: var(--text-primary); }

    /* ── Quick stats (cards) ── */
    .qcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .qcard { position: relative; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; display: flex; align-items: center; gap: 12px; transition: all 0.14s var(--bc-easing); overflow: hidden; }
    .qcard:hover { transform: translateY(-1px); border-color: var(--border-2); box-shadow: 0 8px 24px rgba(15,17,23,0.07); }

    .qcard-info { flex: 1; min-width: 0; }
    .qcard-num { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1; }
    .qcard-label { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em; }

    .qcard-trend.up { background: rgba(22,163,74,0.10); color: var(--bc-success); }
    .qcard-trend.dn { background: rgba(220,38,38,0.10); color: var(--bc-danger); }

    /* ── Settings shell (sidebar + main) ── */
    .cfg-shell { display: grid; grid-template-columns: 248px 1fr; min-height: calc(100vh - 48px); margin: -24px -20px; }
    .cfg-main { padding: 32px 36px 48px; overflow-y: auto; background: var(--canvas, var(--surface-2)); }
    .cfg-main-inner { max-width: 980px; margin: 0 auto; }
    .cfg-page-head { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .cfg-page-head-titles { flex: 1; min-width: 0; }
    .cfg-page-eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.16em; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .cfg-page-eyebrow .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .cfg-page-head h1 { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 32px; letter-spacing: -0.035em; line-height: 1; color: var(--text-primary); margin: 0 0 7px; }
    .cfg-page-head p { font-size: 13.5px; color: var(--text-muted); max-width: 540px; line-height: 1.55; margin: 0; }
    .cfg-page-head-cta { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .cfg-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; font-size: 12.5px; font-weight: 600; border-radius: 9px; border: 1px solid transparent; transition: all .14s var(--bc-easing); white-space: nowrap; cursor: pointer; font-family: inherit; }
    .cfg-btn svg { width: 13px; height: 13px; }
    .cfg-btn-primary { background: linear-gradient(135deg, var(--accent), #6366f1); color: #fff; border-color: var(--accent); box-shadow: 0 6px 14px rgba(79,70,229,0.18); }
    .cfg-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(79,70,229,0.20); }
    .cfg-btn-secondary { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
    .cfg-btn-secondary:hover { background: var(--surface-2); }
    .cfg-btn-ghost { color: var(--text-secondary); background: transparent; }
    .cfg-btn-ghost:hover { background: var(--surface-2); color: var(--text-primary); }
    .cfg-search { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; transition: all .14s var(--bc-easing); }
    .cfg-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .cfg-search svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .cfg-search input { flex: 1; border: none; outline: none; background: transparent; font-size: 13px; color: var(--text-primary); font-family: inherit; min-width: 0; }
    .cfg-empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; padding: 48px 32px; text-align: center; color: var(--text-muted); }
    .cfg-empty svg { width: 42px; height: 42px; color: var(--text-muted); opacity: 0.4; margin-bottom: 14px; }
    .cfg-empty-title { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 16px; color: var(--text-primary); margin-bottom: 4px; }
    .cfg-empty-text { font-size: 13px; max-width: 380px; margin: 0 auto 18px; }

    /* ── Settings sidebar redesign ── */
    .cfg-side { background: var(--surface); border-right: 1px solid var(--border); padding: 24px 12px; display: flex; flex-direction: column; flex-shrink: 0; width: 240px; }
    .cfg-side-ws { margin: 0 8px 16px; padding: 12px 14px; background: linear-gradient(135deg, rgba(79,70,229,0.06), rgba(168,85,247,0.04)); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; gap: 10px; }

    .cfg-side-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    .cfg-side-foot { margin-top: auto; padding: 14px 14px 0; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-muted); }
    .cfg-side-foot-version { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); margin-left: auto; }

    /* ── Cfg cards (padrão unificado pra Equipe/Financeiro/API) ── */
    .cfg-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 18px; box-shadow: 0 2px 6px rgba(15,17,23,0.05), 0 1px 2px rgba(15,17,23,0.04); overflow: hidden; }
    .cfg-card-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 14px; background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); }
    .cfg-card-title-block { flex: 1; min-width: 0; }
    .cfg-card-title { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 16px; letter-spacing: -0.018em; color: var(--text-primary); margin: 0 0 3px; }
    .cfg-card-sub { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 0; }
    .cfg-card-sub code, .cfg-card-sub .hdr-code { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 4px; }
    .cfg-card-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 100px; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); flex-shrink: 0; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
    .cfg-card-badge.connected { background: rgba(22,163,74,0.10); color: var(--bc-success); border-color: rgba(22,163,74,0.20); }
    .cfg-card-badge.connected .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bc-success); box-shadow: 0 0 0 3px rgba(22,163,74,0.18); animation: cfgPulse 1.6s ease-in-out infinite; }
    @keyframes cfgPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cfg-head-cta { padding: 7px 13px !important; font-size: 12px !important; flex-shrink: 0; }
    .cfg-card-body { padding: 18px 20px; }
    .cfg-card-foot { padding: 12px 20px; border-top: 1px solid var(--surface-3); background: var(--surface-2); display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .cfg-card-foot-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
    .cfg-card-foot-tip { font-size: 11px; color: var(--text-muted); margin-left: 4px; }
    .cfg-card-foot-tip code { font-family: 'JetBrains Mono', monospace; background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; font-size: 10.5px; font-weight: 700; }

    /* Add row */
    .cfg-add-row { display: flex; gap: 8px; align-items: center; padding: 14px; background: var(--surface-2); border: 1.5px dashed var(--border-2); border-radius: 11px; margin-bottom: 14px; }
    .cfg-input { flex: 1; padding: 10px 13px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 9px; font-size: 13px; color: var(--text-primary); outline: none; font-family: inherit; transition: all 0.12s var(--bc-easing); }
    .cfg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* Lista cfg-row */
    .cfg-list { display: flex; flex-direction: column; gap: 8px; }
    .cfg-row { display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; transition: all 0.12s var(--bc-easing); }
    .cfg-row:hover { border-color: var(--border-2); background: var(--surface-2); }
    .cfg-row.revoked { opacity: 0.55; }
    .cfg-row.paused { background: var(--surface-2); }
    .cfg-row.paused .cfg-row-name { color: var(--text-muted); }
    .cfg-row-main { flex: 1; min-width: 0; }
    .cfg-row-name { font-weight: 700; font-size: 13.5px; color: var(--text-primary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
    .cfg-row-meta { font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .cfg-row-meta .ip { font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); }
    .cfg-row-meta .dot-sep, .cfg-row-meta-inline { display: inline-block; }
    .cfg-row-meta .dot-sep { width: 2.5px; height: 2.5px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; align-self: center; }
    .cfg-row-url { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-secondary); background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; display: inline-block; max-width: 100%; }
    .cfg-row.paused .cfg-row-url { opacity: 0.7; }
    .cfg-row-events { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .cfg-row-meta-inline { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-left: 4px; }
    .cfg-row-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .key-prefix { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; background: var(--surface-2); color: var(--text-secondary); padding: 2px 8px; border-radius: 5px; border: 1px solid var(--border); }
    .badge-revoked { font-size: 9.5px; font-weight: 700; background: rgba(220,38,38,0.10); color: var(--bc-danger); padding: 2px 7px; border-radius: 4px; margin-left: 6px; letter-spacing: 0.08em; }

    /* Botões inline (ações em linha) */
    .btn-row-act { font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all 0.12s var(--bc-easing); margin-left: 4px; font-family: inherit; }
    .btn-row-act:first-child { margin-left: 0; }
    .btn-row-act:hover { background: var(--surface-2); border-color: var(--border-2); color: var(--text-primary); }
    .btn-row-act.danger, .btn-row-act.revoke { background: rgba(220,38,38,0.06); color: var(--bc-danger); border-color: rgba(220,38,38,0.20); }
    .btn-row-act.danger:hover, .btn-row-act.revoke:hover { background: rgba(220,38,38,0.10); border-color: var(--bc-danger); }
    .btn-row-act.test { background: var(--accent-soft); color: var(--accent); border-color: rgba(79,70,229,0.20); }
    .btn-row-act.test:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-row-act.success { background: rgba(22,163,74,0.10); color: var(--bc-success); border-color: rgba(22,163,74,0.20); }
    .btn-row-act.success:hover { background: var(--bc-success); color: #fff; }

    /* Icon button (lápis/lixeira inline) */
    .cfg-icon-btn { width: 28px; height: 28px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); transition: all .12s var(--bc-easing); background: transparent; border: none; cursor: pointer; }
    .cfg-icon-btn:hover { background: var(--surface-2); color: var(--text-primary); }
    .cfg-icon-btn.danger:hover { background: rgba(220,38,38,0.10); color: var(--bc-danger); }
    .cfg-icon-btn svg { width: 14px; height: 14px; }

    /* ── Pills (status, perms) ── */
    .cfg-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; }
    .cfg-pill-success { background: rgba(22,163,74,0.10); color: var(--bc-success); }
    .cfg-pill-success::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bc-success); box-shadow: 0 0 0 3px rgba(22,163,74,0.18); }
    .cfg-pill-admin { background: rgba(79,70,229,0.10); color: var(--accent); font-weight: 700; }
    .cfg-pill-admin svg { width: 11px; height: 11px; }
    .cfg-pill-warn { background: rgba(217,119,6,0.10); color: var(--bc-warning); }
    .cfg-pill-muted { background: var(--surface-2); color: var(--text-muted); font-style: italic; }

    /* ── Equipe (team table) ── */
    .team-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(15,17,23,0.05), 0 1px 2px rgba(15,17,23,0.04); }
    .team-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .team-table thead th { text-align: left; padding: 14px 18px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: var(--text-muted); background: var(--surface-2); border-bottom: 1px solid var(--border); }
    .team-table tbody td { padding: 13px 18px; border-bottom: 1px solid var(--surface-3); }
    .team-table tbody tr:last-child td { border-bottom: none; }
    .team-table tbody tr:hover { background: var(--surface-2); }
    .team-user { display: flex; align-items: center; gap: 11px; }
    .team-av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 12px; flex-shrink: 0; }
    .team-name { font-weight: 600; color: var(--text-primary); }
    .team-email { font-size: 11.5px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    /* ── Tags ── */
    .tag-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 2px 6px rgba(15,17,23,0.05), 0 1px 2px rgba(15,17,23,0.04); }
    .tag-bigchip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 14px; border-radius: 100px; font-size: 13px; font-weight: 600; cursor: default; transition: all .14s var(--bc-easing); position: relative; user-select: none; margin: 0 6px 6px 0; }
    .tag-bigchip:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(15,17,23,0.05); }
    .tag-bigchip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: currentColor; opacity: 0.6; }
    .tag-bigchip-count { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: rgba(255,255,255,0.40); color: inherit; opacity: 0.85; }
    .tag-bigchip-rm { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; opacity: 0; transition: all .12s var(--bc-easing); margin-left: 2px; border: none; color: inherit; }
    .tag-bigchip:hover .tag-bigchip-rm { opacity: 0.8; }
    .tag-bigchip-rm:hover { background: rgba(0,0,0,0.10); opacity: 1 !important; }
    .tag-bigchip-rm svg { width: 11px; height: 11px; }
    .tag-create-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .tag-create-row .cfg-input { flex: 1; }

    /* ── Modelos ── */
    .tabs-row { display: flex; gap: 6px; margin-bottom: 18px; background: var(--surface-3); border-radius: 11px; padding: 4px; width: fit-content; }
    .tab-btn { padding: 7px 16px; font-size: 12.5px; font-weight: 600; border-radius: 8px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 7px; transition: all .14s var(--bc-easing); background: transparent; border: none; cursor: pointer; font-family: inherit; }
    .tab-btn:hover { color: var(--text-primary); }
    .tab-btn.active { background: var(--surface); color: var(--text-primary); box-shadow: 0 1px 2px rgba(15,17,23,0.06); }
    .tab-btn svg { width: 14px; height: 14px; }
    .tab-count { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--surface-3); color: var(--text-muted); line-height: 1.4; }
    .tab-btn.active .tab-count { background: var(--accent-soft); color: var(--accent); }

    .tpl-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .tpl-toolbar .cfg-search-input { flex: 1; max-width: 340px; }
    .cfg-search-input { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; transition: all .14s var(--bc-easing); }
    .cfg-search-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .cfg-search-input svg { width: 14px; height: 14px; color: var(--text-muted); }
    .cfg-search-input input { flex: 1; border: none; outline: none; background: transparent; font-size: 13px; font-family: inherit; color: var(--text-primary); }

    .tpl-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .tpl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: all .15s var(--bc-easing); position: relative; overflow: hidden; }
    .tpl-card:hover { border-color: var(--border-2); box-shadow: 0 8px 24px rgba(15,17,23,0.07); transform: translateY(-1px); }
    .tpl-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .tpl-card-name { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 15px; letter-spacing: -0.015em; color: var(--text-primary); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
    .tpl-card-cat { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
    .tpl-card-cat.abord { background: rgba(79,70,229,0.10); color: var(--accent); }
    .tpl-card-cat.fup { background: rgba(217,119,6,0.10); color: var(--bc-warning); }
    .tpl-card-cat.cur { background: rgba(168,85,247,0.10); color: #a855f7; }
    .tpl-card-cat.ger { background: var(--surface-2); color: var(--text-muted); }
    .tpl-card-cat.ven { background: rgba(22,163,74,0.10); color: var(--bc-success); }
    .tpl-card-content { font-size: 13px; line-height: 1.5; color: var(--text-secondary); background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface-2) 80%, transparent 100%); border-radius: 9px; padding: 11px 13px; position: relative; max-height: 88px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    .tpl-card-content code, .tpl-card-content .var-token { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; }
    .tpl-card-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; border-top: 1px solid var(--surface-3); margin-top: auto; }
    .tpl-card-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
    .tpl-card-meta-icon { width: 18px; height: 18px; border-radius: 5px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .tpl-card-meta-icon svg { width: 11px; height: 11px; }
    .tpl-card-actions { display: flex; gap: 2px; }

    /* Áudio variant */
    .tpl-card.audio { background: linear-gradient(180deg, var(--surface) 0%, rgba(79,70,229,0.02) 100%); }
    .tpl-audio-player { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: linear-gradient(135deg, rgba(79,70,229,0.08), rgba(168,85,247,0.05)); border: 1px solid rgba(79,70,229,0.15); border-radius: 9px; }
    .tpl-audio-play { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #6366f1); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 10px rgba(79,70,229,0.18); transition: transform 0.15s var(--bc-easing); border: none; cursor: pointer; }
    .tpl-audio-play:hover { transform: scale(1.07); }
    .tpl-audio-play svg { width: 13px; height: 13px; }
    .tpl-audio-wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 24px; }
    .tpl-audio-wave span { flex: 1; background: linear-gradient(180deg, var(--accent-light), var(--accent)); border-radius: 1px; opacity: 0.7; }
    .tpl-audio-time { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--accent); font-weight: 600; }

    /* ── Chat audio bubble — WhatsApp/iMessage pill style ── */
    .audio-bubble { display: inline-flex; align-items: center; gap: 10px; padding: 7px 12px 7px 7px; background: rgba(255,255,255,0.96); border-radius: 16px; box-shadow: 0 1px 2px rgba(15,17,23,0.06); min-width: 220px; max-width: 280px; }
    .audio-bubble .audio-play-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border: none; cursor: pointer; transition: transform 0.12s, background 0.12s; padding: 0; }
    .audio-bubble .audio-play-btn:hover { background: var(--accent-hover, #4338ca); transform: scale(1.05); }
    .audio-bubble .audio-play-btn svg { width: 14px; height: 14px; }
    .audio-bubble .audio-play-btn .audio-icon-play { margin-left: 2px; }
    .audio-bubble .audio-progress-bar { position: relative; height: 22px; cursor: pointer; width: 150px; flex-shrink: 0; }
    .audio-bubble .audio-wave-base, .audio-bubble .audio-wave-fill { position: absolute; left: 0; top: 0; bottom: 0; display: flex; gap: 2.5px; align-items: center; width: 150px; pointer-events: none; }
    .audio-bubble .audio-progress { position: absolute; left: 0; top: 0; bottom: 0; height: 100%; overflow: hidden; background: transparent !important; border-radius: 0 !important; }
    .audio-bubble .audio-wave-base i, .audio-bubble .audio-wave-fill i { display: block; flex: 1 1 0; min-width: 2px; border-radius: 1.5px; }
    .audio-bubble .audio-wave-base i { background: rgba(99,102,241,0.32); }
    .audio-bubble .audio-wave-fill i { background: var(--accent); }

    .audio-bubble .audio-wave-base i:nth-child(4),  .audio-bubble .audio-wave-fill i:nth-child(4)  { height: 14px; }
    .audio-bubble .audio-wave-base i:nth-child(5),  .audio-bubble .audio-wave-fill i:nth-child(5)  { height: 9px; }
    .audio-bubble .audio-wave-base i:nth-child(6),  .audio-bubble .audio-wave-fill i:nth-child(6)  { height: 12px; }
    .audio-bubble .audio-wave-base i:nth-child(7),  .audio-bubble .audio-wave-fill i:nth-child(7)  { height: 11px; }
    .audio-bubble .audio-wave-base i:nth-child(8),  .audio-bubble .audio-wave-fill i:nth-child(8)  { height: 16px; }
    .audio-bubble .audio-wave-base i:nth-child(9),  .audio-bubble .audio-wave-fill i:nth-child(9)  { height: 9px; }
    .audio-bubble .audio-wave-base i:nth-child(10), .audio-bubble .audio-wave-fill i:nth-child(10) { height: 18px; }
    .audio-bubble .audio-wave-base i:nth-child(11), .audio-bubble .audio-wave-fill i:nth-child(11) { height: 12px; }
    .audio-bubble .audio-wave-base i:nth-child(12), .audio-bubble .audio-wave-fill i:nth-child(12) { height: 17px; }
    .audio-bubble .audio-wave-base i:nth-child(13), .audio-bubble .audio-wave-fill i:nth-child(13) { height: 14px; }
    .audio-bubble .audio-wave-base i:nth-child(14), .audio-bubble .audio-wave-fill i:nth-child(14) { height: 19px; }
    .audio-bubble .audio-wave-base i:nth-child(15), .audio-bubble .audio-wave-fill i:nth-child(15) { height: 13px; }
    .audio-bubble .audio-wave-base i:nth-child(16), .audio-bubble .audio-wave-fill i:nth-child(16) { height: 20px; }
    .audio-bubble .audio-wave-base i:nth-child(17), .audio-bubble .audio-wave-fill i:nth-child(17) { height: 12px; }
    .audio-bubble .audio-wave-base i:nth-child(18), .audio-bubble .audio-wave-fill i:nth-child(18) { height: 17px; }
    .audio-bubble .audio-wave-base i:nth-child(19), .audio-bubble .audio-wave-fill i:nth-child(19) { height: 11px; }
    .audio-bubble .audio-wave-base i:nth-child(20), .audio-bubble .audio-wave-fill i:nth-child(20) { height: 15px; }
    .audio-bubble .audio-wave-base i:nth-child(21), .audio-bubble .audio-wave-fill i:nth-child(21) { height: 8px; }
    .audio-bubble .audio-wave-base i:nth-child(22), .audio-bubble .audio-wave-fill i:nth-child(22) { height: 13px; }
    .audio-bubble .audio-wave-base i:nth-child(23), .audio-bubble .audio-wave-fill i:nth-child(23) { height: 9px; }
    .audio-bubble .audio-wave-base i:nth-child(24), .audio-bubble .audio-wave-fill i:nth-child(24) { height: 11px; }
    .audio-bubble .audio-wave-base i:nth-child(25), .audio-bubble .audio-wave-fill i:nth-child(25) { height: 6px; }
    .audio-bubble .audio-wave-base i:nth-child(26), .audio-bubble .audio-wave-fill i:nth-child(26) { height: 9px; }
    .audio-bubble .audio-wave-base i:nth-child(27), .audio-bubble .audio-wave-fill i:nth-child(27) { height: 7px; }
    .audio-bubble .audio-wave-base i:nth-child(28), .audio-bubble .audio-wave-fill i:nth-child(28) { height: 8px; }
    .audio-bubble .audio-duration { display: none; }

    /* ── Financeiro ── */
    .fin-types-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 6px rgba(15,17,23,0.05), 0 1px 2px rgba(15,17,23,0.04); }

    .fin-type-comm { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-family: 'JetBrains Mono', monospace; }
    .fin-type-comm input { width: 46px; background: transparent; border: none; outline: none; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--text-primary); text-align: right; padding: 0; }

    .fin-info-card { background: linear-gradient(135deg, rgba(79,70,229,0.05), rgba(168,85,247,0.04)); border: 1px solid var(--accent); border-left: 3px solid var(--accent); border-radius: 11px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; margin-top: 18px; }

    /* ── API/Integrações específicos ── */

    .int-key-revealed-ok { font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 7px; background: #fff; border: 1px solid #fde68a; color: #92400e; cursor: pointer; transition: all 0.12s var(--bc-easing); font-family: inherit; }
    .int-key-revealed-ok:hover { background: #fef9c3; }
    .int-key-revealed-row { display: flex; gap: 8px; align-items: center; }

    .int-event-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }

    .wh-badge { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.06em; }

    /* Avatar session (Foto de Perfil WhatsApp) */

    .avatar-session-icon { width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(135deg, #16a34a, #22c55e); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 6px 14px rgba(22,163,74,0.30); }
    .avatar-session-icon svg { width: 20px; height: 20px; }
    .avatar-session-num { font-family: 'JetBrains Mono', monospace; font-size: 14.5px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.005em; }
    .avatar-session-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    /* cURL banner */

    .curl-banner::before { content: ""; position: absolute; inset: 0; z-index: 0; background: radial-gradient(ellipse at 100% 0%, rgba(79,70,229,0.30) 0%, transparent 50%); pointer-events: none; }

    .curl-banner-title svg { width: 16px; height: 16px; color: var(--accent-light); }
    .curl-banner-copy { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 7px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.10); cursor: pointer; transition: all 0.12s var(--bc-easing); font-family: inherit; }

    .ck-cmd { color: #c4b5fd; font-weight: 600; }
    .ck-str { color: #86efac; }
    .ck-url { color: #7dd3fc; }
    .curl-banner-foot { font-size: 12px; color: rgba(255,255,255,0.55); margin: 12px 0 0; line-height: 1.5; }
    .curl-banner-foot a { color: #a5b4fc; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; transition: color 0.12s var(--bc-easing); text-decoration: none; }
    .curl-banner-foot a:hover { color: #c4b5fd; }
    .curl-banner-foot a svg { width: 11px; height: 11px; transition: transform 0.12s var(--bc-easing); }
    .curl-banner-foot a:hover svg { transform: translateX(2px); }
  
/* ═══════════════════════════════════════════════════════════════════
       AGENTES IA — design system espelhado dos Disparos (.bc-*).
       Classes prefixadas .ai- pra isolar.
       ═══════════════════════════════════════════════════════════════════ */
    .ai-page { max-width: 1180px; margin: 0 auto; padding: 28px 28px 80px; }
    .ai-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; gap: 24px; flex-wrap: wrap; }
    .ai-header h1 { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.035em; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 14px; }
    .ai-header-sub { font-size: 13px; color: var(--text-secondary); margin-top: 8px; max-width: 540px; line-height: 1.55; }
    .ai-header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* Key status pill */
    .ai-key-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; }
    .ai-key-pill.ok  { background: #dcfce7; color: #166534; }
    .ai-key-pill.warn { background: #fef3c7; color: #92400e; }

    /* Stats */
    .ai-stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; overflow: hidden; box-shadow: var(--bc-shadow-sm); }
    .ai-stat { padding: 18px 22px; border-right: 1px solid var(--border); }
    .ai-stat:last-child { border-right: none; }
    .ai-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
    .ai-stat-num { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 28px; color: var(--text-primary); letter-spacing: -0.025em; line-height: 1; }
    .ai-stat-sub { margin-top: 8px; font-size: 11px; color: var(--text-secondary); }

    /* Filter chips */
    .ai-filters-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .ai-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; font-size: 12px; color: var(--text-secondary); font-weight: 500; transition: all 0.14s var(--bc-easing); cursor: pointer; }
    .ai-chip:hover { background: var(--surface-2); color: var(--text-primary); }
    .ai-chip.active { background: var(--sidebar-bg); color: #fff; border-color: var(--sidebar-bg); }
    .ai-chip-count { background: rgba(255,255,255,0.18); padding: 1px 7px; border-radius: 100px; font-size: 10.5px; font-weight: 700; }
    .ai-chip:not(.active) .ai-chip-count { background: var(--surface-2); color: var(--text-muted); }

    /* Agent grid */
    .ai-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
    .ai-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 14px; transition: all 0.18s var(--bc-easing); box-shadow: var(--bc-shadow-sm); position: relative; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 12px; }
    .ai-card:hover { transform: translateY(-1px); box-shadow: var(--bc-shadow); border-color: var(--border-2); }
    .ai-card-active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
    .ai-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .ai-card-title-block { flex: 1; min-width: 0; }
    .ai-card-title { font-family: 'Bricolage Grotesque', serif; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.2; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-card-sub { font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .ai-card-sub-dot { width: 3px; height: 3px; background: var(--text-muted); border-radius: 50%; }
    .ai-card-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ai-card-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .ai-card-foot { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-muted); }
    .ai-card-foot strong { font-family: 'JetBrains Mono', monospace; color: var(--text-primary); font-weight: 600; }

    /* Pills */
    .ai-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 100px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .ai-pill-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .ai-pill-auto { background: var(--accent-soft); color: var(--accent); }
    .ai-pill-auto .ai-pill-dot { background: var(--accent); animation: bcPulse 1.4s ease-in-out infinite; }
    .ai-pill-suggested { background: var(--accent-softer); color: #6b21a8; }
    .ai-pill-suggested .ai-pill-dot { background: #a855f7; }
    .ai-pill-channel { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); padding: 2px 7px; font-size: 10px; }

    /* Toggle switch */
    /* (Removido) — versão antiga do .ai-switch (slider/::before) substituída pela canônica abaixo. */

    /* Empty state */
    .ai-empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; padding: 60px 24px; text-align: center; grid-column: 1/-1; }
    .ai-empty-emoji { font-size: 48px; margin-bottom: 8px; }
    .ai-empty-title { font-family: 'Bricolage Grotesque', serif; font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.02em; }
    .ai-empty-sub { font-size: 13px; color: var(--text-secondary); }

    /* Modal */
    .ai-modal-bd { position: fixed; inset: 0; background: rgba(11,13,18,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .ai-modal { background: var(--surface); border-radius: 16px; max-width: 820px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(15,17,23,0.22), 0 4px 12px rgba(15,17,23,0.08); overflow: hidden; }
    .ai-modal-head { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 14px; background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); }
    .ai-modal-title { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 20px; letter-spacing: -0.025em; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 11px; }
    .ai-modal-close { width: 34px; height: 34px; background: transparent; border: none; cursor: pointer; color: var(--text-muted); border-radius: 9px; transition: all 0.14s var(--bc-easing); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .ai-modal-close:hover { background: var(--surface-2); color: var(--text-primary); transform: rotate(90deg); }
    .ai-modal-close svg { width: 16px; height: 16px; }
    .ai-modal-tabs { display: flex; padding: 0 22px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .ai-modal-tab { padding: 12px 16px; border: none; background: transparent; color: var(--text-muted); border-bottom: 2px solid transparent; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.14s; display: flex; align-items: center; gap: 6px; }
    .ai-modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .ai-modal-tab:not(.active):hover { color: var(--text-primary); background: var(--surface-2); }
    .ai-modal-tab.disabled { opacity: 0.4; cursor: not-allowed; }
    .ai-modal-body { flex: 1; overflow-y: auto; padding: 24px; }
    .ai-modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); }
    .ai-modal-foot-left { display: flex; gap: 8px; }
    .ai-modal-foot-right { display: flex; gap: 8px; margin-left: auto; }

    /* Form layout inside modal */
    .ai-form { display: grid; gap: 16px; }
    .ai-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ai-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .ai-section-title { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 14px; letter-spacing: -0.012em; color: var(--text-primary); margin: 8px 0 4px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .ai-field-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .ai-channels-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .ai-channel-chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 13px 7px 10px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text-secondary); transition: background-color 0.14s var(--bc-easing), border-color 0.14s var(--bc-easing), color 0.14s var(--bc-easing); user-select: none; }
    .ai-channel-chip:hover { border-color: var(--accent); color: var(--text-primary); }
    .ai-channel-chip input[type="checkbox"] { appearance: none; -webkit-appearance: none; -moz-appearance: none; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border-2, #d8dbe4); background: var(--surface); cursor: pointer; flex-shrink: 0; margin: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; position: relative; transition: background-color 0.12s var(--bc-easing), border-color 0.12s var(--bc-easing); }
    .ai-channel-chip input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
    .ai-channel-chip input[type="checkbox"]:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); display: block; }
    .ai-channel-chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    /* ════════════════════════════════════════════════════════════════════════
       PADRÃO GLOBAL — Checkboxes e Toggles Lowan
       ════════════════════════════════════════════════════════════════════════
       Use:
       • <input type="checkbox"> em qualquer lugar       → vira quadrado custom indigo
       • <input type="checkbox" class="cb-native">       → mantém aparência nativa do browser
       • <span class="lw-switch on?"><input.../><span class="lw-switch-track"></span><span class="lw-switch-thumb"></span></span>
                                                          → toggle iOS-style (.on liga)

       Componentes legados continuam funcionando (.toggle-switch, .perm-toggle, .ai-channel-chip
       — esses têm estilo próprio e são protegidos via :not()).
       ════════════════════════════════════════════════════════════════════════ */

    /* Checkbox global custom (auto-aplica em todos os <input type="checkbox"> do app) */
    input[type="checkbox"]:not(.cb-native):not(.ai-channel-chip input):not(.lw-switch input):not(.ai-switch input):not(.toggle-switch input):not(.perm-toggle input):not(.perm-row input):not(.lds-cb) {
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      width: 17px; height: 17px; border-radius: 4px;
      border: 1.5px solid var(--border-2, #d8dbe4); background: var(--surface);
      cursor: pointer; margin: 0; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      position: relative; vertical-align: middle;
      transition: background-color 0.12s var(--bc-easing), border-color 0.12s var(--bc-easing);
    }
    input[type="checkbox"]:not(.cb-native):not(.ai-channel-chip input):not(.lw-switch input):not(.ai-switch input):not(.toggle-switch input):not(.perm-toggle input):not(.perm-row input):not(.lds-cb):hover {
      border-color: var(--accent);
    }
    input[type="checkbox"]:not(.cb-native):not(.ai-channel-chip input):not(.lw-switch input):not(.ai-switch input):not(.toggle-switch input):not(.perm-toggle input):not(.perm-row input):not(.lds-cb):checked {
      background: var(--accent); border-color: var(--accent);
    }
    input[type="checkbox"]:not(.cb-native):not(.ai-channel-chip input):not(.lw-switch input):not(.ai-switch input):not(.toggle-switch input):not(.perm-toggle input):not(.perm-row input):not(.lds-cb):checked::after {
      content: ""; width: 9px; height: 5px;
      border-left: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translate(1px, -1px); display: block;
    }
    input[type="checkbox"]:not(.cb-native):focus-visible {
      outline: 2px solid var(--accent); outline-offset: 1px;
    }

    /* Checkbox dentro de .ai-channel-chip — variante visual menor (controlada pelo chip) */
    .ai-channel-chip input[type="checkbox"] { appearance: none; -webkit-appearance: none; -moz-appearance: none; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border-2, #d8dbe4); background: var(--surface); cursor: pointer; flex-shrink: 0; margin: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; position: relative; transition: background-color 0.12s var(--bc-easing), border-color 0.12s var(--bc-easing); }
    .ai-channel-chip input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
    .ai-channel-chip input[type="checkbox"]:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); display: block; }

    /* Toggle switch global — padrão Lowan (.lw-switch) e alias .ai-switch (compat) */
    .lw-switch, .ai-switch { position: relative; display: inline-flex; align-items: center; flex-shrink: 0; width: 38px; height: 22px; cursor: pointer; user-select: none; }
    .lw-switch input, .ai-switch input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
    .lw-switch-track, .ai-switch-track { position: absolute; inset: 0; border-radius: 100px; background: var(--surface-3, #eef0f6); transition: background-color 0.18s var(--bc-easing), border-color 0.14s var(--bc-easing); border: 1.5px solid var(--border); }
    .lw-switch-thumb, .ai-switch-thumb { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,17,23,0.08), 0 1px 3px rgba(15,17,23,0.10); transition: transform 0.18s var(--bc-easing); }
    .lw-switch.on .lw-switch-track, .ai-switch.on .ai-switch-track { background: var(--accent); border-color: var(--accent); }
    .lw-switch.on .lw-switch-thumb, .ai-switch.on .ai-switch-thumb { transform: translateX(16px); }
    .lw-switch:hover .lw-switch-track, .ai-switch:hover .ai-switch-track { border-color: var(--accent); }
    .lw-switch:focus-within .lw-switch-track, .ai-switch:focus-within .ai-switch-track { box-shadow: 0 0 0 3px var(--accent-soft); }

    .ai-prompt-tpl { display: flex; gap: 5px; align-items: center; }
    .ai-prompt-tpl-btn { padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 11px; font-weight: 600; cursor: pointer; text-transform: capitalize; transition: all 0.14s; }
    .ai-prompt-tpl-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    /* Test tab */
    .ai-test-info { background: var(--accent-softer); border: 1px solid var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .ai-test-bubble-user { background: var(--surface-2); padding: 10px 14px; border-radius: 12px 12px 12px 4px; font-size: 13.5px; line-height: 1.5; max-width: 85%; }
    .ai-test-bubble-bot  { background: var(--accent-soft); padding: 10px 14px; border-radius: 12px 12px 4px 12px; font-size: 13.5px; line-height: 1.5; max-width: 85%; margin-left: auto; color: var(--text-primary); white-space: pre-wrap; }
    .ai-test-meta { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; gap: 12px; }
    .ai-test-meta strong { font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); }

    /* Logs */
    .ai-log-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .ai-log-row + .ai-log-row { margin-top: 8px; }
    .ai-log-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 11px; color: var(--text-muted); }
    .ai-log-status { padding: 2px 9px; border-radius: 100px; font-weight: 600; font-size: 10.5px; }
    .ai-log-status.ok { background: #dcfce7; color: #166534; }
    .ai-log-status.fail { background: #fee2e2; color: #991b1b; }
    .ai-log-status.suggested { background: var(--accent-softer); color: #6b21a8; }
    .ai-log-msg { font-size: 12.5px; line-height: 1.5; padding: 6px 10px; border-radius: 6px; margin-top: 4px; }
    .ai-log-msg.user { background: var(--surface-2); }
    .ai-log-msg.bot { background: var(--accent-softer); }
    .ai-log-meta { font-family: 'JetBrains Mono', monospace; }

    /* API key modal smaller */
    .ai-key-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; transition: border-color 0.14s; }
    .ai-key-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .ai-key-help { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin: 8px 0 14px; }
    .ai-key-help a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .ai-key-help a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      .ai-stats { grid-template-columns: repeat(2, 1fr); }
      .ai-stat:nth-child(2) { border-right: none; }
      .ai-stat:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
      .ai-row-2, .ai-row-3 { grid-template-columns: 1fr; }
      .ai-header h1 { font-size: 32px; }
    }
    /* ─── Agentes IA: Modal v2 (layout em seções com cards) ───── */
    .ai-form-section { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    .ai-form-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
    .ai-form-section-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ai-form-section-title { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 14px; letter-spacing: -0.012em; color: var(--text-primary); margin: 0; line-height: 1.2; }
    .ai-form-section-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    /* Force block layout for ai-form labels and inputs */

    .ai-form-section .form-label { display: block !important; font-size: 11px !important; font-weight: 600 !important; color: var(--text-secondary) !important; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px !important; }
    .ai-form .form-input,
    .ai-form-section .form-input { display: block !important; width: 100% !important; box-sizing: border-box; padding: 9px 12px !important; font-size: 13px !important; border: 1px solid var(--border) !important; border-radius: 8px !important; background: var(--surface) !important; color: var(--text-primary) !important; transition: border-color 0.14s, box-shadow 0.14s; font-family: inherit; }
    .ai-form .form-input:focus,
    .ai-form-section .form-input:focus { outline: none !important; border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft) !important; }
    /* CDD usado no AI modal — alinha visual com form-input */
    .ai-form .ai-cdd, .ai-form-section .ai-cdd { display: block; width: 100%; }
    .ai-form .ai-cdd .cdd-btn, .ai-form-section .ai-cdd .cdd-btn { height: 38px; border-width: 1px; padding: 0 12px 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; }
    .ai-form .ai-cdd .cdd-btn:hover, .ai-form-section .ai-cdd .cdd-btn:hover { border-color: var(--accent); }
    /* O painel dropdown vira position:fixed via JS — não usar width:100% (vira 100% do viewport).
       O JS já seta min-width igual à largura do botão; só ajustamos max-width pra não estourar. */
    .ai-form .ai-cdd .cdd-drop, .ai-form-section .ai-cdd .cdd-drop { max-width: 420px; }
    .ai-form .ai-cdd .cdd-arr, .ai-form-section .ai-cdd .cdd-arr { color: var(--text-muted); }
    .ai-form textarea.form-input,
    .ai-form-section textarea.form-input { resize: vertical; min-height: 80px; line-height: 1.55; }

    .ai-row-2 { display: grid !important; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ai-row-3 { display: grid !important; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .ai-row-2 > *, .ai-row-3 > * { min-width: 0; }

    .ai-field-hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; line-height: 1.4; }
    .ai-field-error { font-size: 11px; color: #dc2626; margin-top: 5px; }

    /* Days of week selector */
    .ai-days-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .ai-day-chip { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text-muted); transition: all 0.14s; user-select: none; }
    .ai-day-chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ai-day-chip:hover:not(.on) { border-color: var(--accent); color: var(--accent); }

    /* Keyword chips */
    .ai-kws-input-wrap { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); min-height: 38px; align-items: center; }
    .ai-kw-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; background: var(--accent-soft); color: var(--accent); border-radius: 100px; font-size: 11.5px; font-weight: 600; }
    .ai-kw-chip-x { background: rgba(0,0,0,0.06); border: none; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: inherit; padding: 0; font-size: 12px; line-height: 1; }
    .ai-kw-chip-x:hover { background: rgba(0,0,0,0.12); }
    .ai-kw-input { border: none; outline: none; background: transparent; flex: 1; min-width: 80px; font-size: 12.5px; color: var(--text-primary); padding: 4px 4px; }

    /* Variable chips (clickable to insert) */
    .ai-vars-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .ai-var-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 6px; background: var(--surface); border: 1px dashed var(--border); cursor: pointer; font-size: 10.5px; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); transition: all 0.14s; }
    .ai-var-chip:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); border-style: solid; }

    /* Mode/type selector cards (radio cards) */
    .ai-radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ai-radio-card { padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; transition: all 0.14s; user-select: none; }
    .ai-radio-card:hover { border-color: var(--border-2); }
    .ai-radio-card.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-softer); }
    .ai-radio-card-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .ai-radio-card-desc { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
    .ai-radio-card.on .ai-radio-card-desc { color: var(--text-secondary); }
    .ai-radio-card-ic { width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; }
    .ai-radio-card.on .ai-radio-card-ic { background: var(--accent); color: #fff; }

    /* Test multi-turn chat */
    .ai-chat-window { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    .ai-chat-msg-bubble { padding: 9px 14px; border-radius: 14px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .ai-chat-msg.user .ai-chat-msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .ai-chat-msg.bot .ai-chat-msg-bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text-primary); border-bottom-left-radius: 4px; }
    .ai-chat-msg-meta { font-size: 10px; color: var(--text-muted); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
    .ai-chat-input-row { display: flex; gap: 6px; align-items: flex-end; margin-top: 10px; }
    .ai-chat-input-row textarea { flex: 1; resize: none; min-height: 40px; max-height: 120px; padding: 10px 12px !important; font-size: 13px !important; }
    .ai-chat-clear { font-size: 11px; color: var(--text-muted); background: transparent; border: none; cursor: pointer; padding: 6px; }
    .ai-chat-clear:hover { color: var(--text-primary); }

    /* Modal larger for the new fields */
    .ai-modal { max-width: 880px !important; }


  
    /* ─── UTM / Marketing section ────────────────────────────── */
    .det-utm-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 11.5px; gap: 8px; }
    .det-utm-key { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; font-size: 10px; flex-shrink: 0; }
    .det-utm-val { color: var(--text-primary); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; text-align: right; word-break: break-all; max-width: 65%; }

    /* UTM modal */
    .utm-modal-bd { position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(2px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.18s ease-out; }

    .utm-modal-title { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 10px; }

    .utm-modal input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    /* Intake token modal */
    .intake-token-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; word-break: break-all; color: var(--text-primary); margin: 8px 0 14px; }

    /* ─── Meta Ads / Tráfego pago ─────────────────────────────── */
