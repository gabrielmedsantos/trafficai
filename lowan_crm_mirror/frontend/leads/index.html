<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lowan CRM · Gestão de Leads</title>
  <link rel="icon" type="image/png" href="icon.png"/><link rel="icon" href="/favicon.ico"/>
  <!-- iOS PWA (Add to Home Screen) -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Lowan"/>
  <meta name="theme-color" content="#ffffff"/>
  <link rel="apple-touch-icon" href="icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tailwind.css?v=1">
  <style>
    :root {
      --sidebar-bg: #111318;
      --sidebar-hover: rgba(255,255,255,0.07);
      --sidebar-active: rgba(99,102,241,0.18);
      --sidebar-active-text: #818cf8;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --border: #e9eaec;
      --text-primary: #111318;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --radius-card: 12px;

      /* ── Disparos redesign — extensões da paleta (não sobrescreve nada existente) */
      --surface-3:     #eef0f3;
      --border-2:      #d1d5db;
      --accent-soft:   #eef2ff;
      --accent-softer: #f5f3ff;
      --accent-light:  #818cf8;
      --bc-success:    #059669;
      --bc-success-soft: #ecfdf5;
      --bc-warning:    #d97706;
      --bc-warning-soft: #fef3c7;
      --bc-danger:     #dc2626;
      --bc-danger-soft: #fef2f2;
      --brand-tg:      #0ea5e9;
      --brand-tg-soft: #e0f2fe;
      --brand-wa:      #16a34a;
      --brand-wa-soft: #dcfce7;
      --bc-easing:     cubic-bezier(0.32, 0.72, 0, 1);
      --bc-shadow-sm:  0 1px 2px rgba(17,19,24,0.04), 0 1px 1px rgba(17,19,24,0.03);
      --bc-shadow:     0 2px 6px rgba(17,19,24,0.05), 0 4px 16px rgba(17,19,24,0.06);
      --bc-shadow-lg:  0 8px 24px rgba(17,19,24,0.08), 0 24px 48px rgba(17,19,24,0.14);
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--surface-2); }
    * { -webkit-font-smoothing: antialiased; }

    /* ─── iOS PWA safe-area (notch / Dynamic Island / home indicator) ───
       Status bar style = "default" → iOS reserva espaço sozinho (sem precisar padding-top no body).
       Aplicamos so safe-area-inset-bottom pra home indicator e classes utility. */
    @supports (padding: env(safe-area-inset-top)) {
      .ios-safe-top    { padding-top: env(safe-area-inset-top); }
      .ios-safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      .ios-safe-x { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    }
    /* 100dvh evita corte por barra dinamica do iOS */
    @supports (height: 100dvh) {
      html, body { height: 100dvh; }
    }
    /* ─── iOS PWA standalone ─── */
    @media (display-mode: standalone) {
      /* Home indicator nao cobre conteudo no rodape */
      body { padding-bottom: env(safe-area-inset-bottom); }
      /* Bloqueia scroll horizontal escondido */
      html, body { overflow-x: hidden; }

      /* WORKAROUND: media queries (max-width: 640) nao disparam consistentemente
         em PWA standalone iOS. Forca layout mobile equivalente aqui. */
      .dash-stats { grid-template-columns: repeat(2, 1fr) !important; }
      .dash-stat { border-right: none !important; border-bottom: 1px solid var(--border) !important; }
      .dash-stat:nth-child(odd) { border-right: 1px solid var(--border) !important; }
      .dash-stat:last-child { border-bottom: none !important; grid-column: span 2 !important; }
    }

    /* Scrollbar refinado */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    /* Toast */
    #toast { transition: opacity 0.25s, transform 0.25s; }

    /* Copy btn */
    .copy-btn { cursor: pointer; }
    .copy-btn:hover { text-decoration: underline; }

    /* Input focus ring padronizado */
    input:focus, textarea:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(99,102,241,0.25);
    }

    /* Sidebar nav item */
    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 500;
      color: #9ca3af;
      transition: background 0.15s, color 0.15s;
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .nav-item:hover { background: var(--sidebar-hover); color: #e5e7eb; }
    .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-active-text); }
    .nav-item .nav-badge {
      position: absolute; top: 6px; right: 6px;
      min-width: 16px; height: 16px; padding: 0 3px;
      border-radius: 99px; background: #ef4444;
      color: white; font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    /* Card base */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
    }

    /* ─── Lowan Tooltip Global ─── */
    .lwn-tooltip {
      position: fixed; z-index: 2147483646;
      background: linear-gradient(180deg, #18191f 0%, #0a0b0f 100%);
      color: #fafafa;
      padding: 6px 11px; border-radius: 7px;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-size: 11.5px; font-weight: 500; line-height: 1.35;
      letter-spacing: -0.005em;
      max-width: 280px; min-width: 0;
      white-space: pre-wrap; word-wrap: break-word;
      pointer-events: none; user-select: none;
      box-shadow:
        0 6px 20px -4px rgba(10,11,15,0.45),
        0 2px 6px rgba(10,11,15,0.18),
        inset 0 1px 0 rgba(255,255,255,0.06);
      opacity: 0; transform: translateY(2px) scale(0.97);
      transition: opacity 0.16s cubic-bezier(0.32,0.72,0,1),
                  transform 0.16s cubic-bezier(0.32,0.72,0,1);
      transform-origin: center bottom;
    }
    .lwn-tooltip.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    .lwn-tooltip[data-placement="bottom"] { transform-origin: center top; }
    .lwn-tooltip::after {
      content: ''; position: absolute;
      width: 7px; height: 7px;
      background: #0a0b0f;
      transform: rotate(45deg);
      box-shadow: 0 2px 4px rgba(10,11,15,0.18);
    }
    .lwn-tooltip[data-placement="top"]::after {
      bottom: -3px; left: 50%; margin-left: -4px;
    }
    .lwn-tooltip[data-placement="bottom"]::after {
      top: -3px; left: 50%; margin-left: -4px;
      background: #18191f;
    }
    .lwn-tooltip kbd {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 600;
      padding: 1px 4px; border-radius: 3px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.10);
      margin: 0 2px;
      color: #e5e7eb;
    }

    /* Modal backdrop blur */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    /* Btn base */
    .btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; border-radius: 8px; transition: background 0.15s, opacity 0.15s; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-2); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Badge de unread */
    .unread-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 4px;
      border-radius: 99px; background: #ef4444;
      color: white; font-size: 10px; font-weight: 700; line-height: 1;
    }

    /* Custom Dropdown CRM */
    .cdd { position: relative; display: inline-block; }
    .cdd-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; height: 36px; padding: 0 10px 0 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text-primary);
      font-size: 13px; font-family: inherit; font-weight: 400;
      cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .cdd-btn:hover { border-color: #b8bcc4; }
    .cdd--open .cdd-btn { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
    .cdd-val { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; text-align: left; }
    .cdd-arr { flex-shrink: 0; color: #9ca3af; transition: transform 0.2s ease; }
    .cdd--open .cdd-arr { transform: rotate(180deg); }
    .cdd-drop {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 9999;
      min-width: 100%; width: max-content; max-width: 320px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 10px 28px -4px rgba(0,0,0,0.12);
      overflow: hidden; max-height: 256px; overflow-y: auto;
      opacity: 0; transform: translateY(-6px) scale(0.98); pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
      transform-origin: top center;
    }
    .cdd--open .cdd-drop { opacity: 1; transform: none; pointer-events: auto; }
    /* Quando portado pro body, perde o pai .cdd--open — usa classe própria */
    .cdd-drop.cdd-portal-open { opacity: 1; transform: none; pointer-events: auto; }
    .cdd-drop::-webkit-scrollbar { width: 4px; }
    .cdd-drop::-webkit-scrollbar-track { background: transparent; }
    .cdd-drop::-webkit-scrollbar-thumb { background: #e9eaec; border-radius: 4px; }
    .cdd-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; font-size: 13px; color: var(--text-primary);
      cursor: pointer; user-select: none; transition: background 0.08s;
      white-space: nowrap;
    }
    .cdd-item:hover { background: var(--surface-2); }
    .cdd-item.is-sel { background: rgba(79,70,229,0.06); color: var(--accent); font-weight: 500; }
    .cdd-item.is-sel:hover { background: rgba(79,70,229,0.1); }
    .cdd-ck { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--accent); }
    /* Pill variant (etapas/status na tabela) */
    .cdd-pill .cdd-btn { height: 26px; padding: 0 7px 0 10px; gap: 4px; border-radius: 99px; font-size: 11px; font-weight: 600; border-width: 1px; }
    .cdd-pill .cdd-arr { width: 10px; height: 10px; }
    .cdd-pill .cdd-drop { min-width: 170px; }
    .cdd-stage-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    /* Extra-small variant para cabeçalho do chat lateral */
    .cdd-xs .cdd-btn { height: 20px; padding: 0 5px 0 7px; gap: 3px; border-radius: 99px; font-size: 10.5px; font-weight: 600; border-width: 1px; }
    .cdd-xs .cdd-arr { width: 8px; height: 8px; }
    .cdd-xs .cdd-stage-dot { width: 6px; height: 6px; }
    .cdd-xs .cdd-drop { min-width: 160px; }
    @keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.88) } to { opacity:1; transform:scale(1) } }

    /* ═══════════════════════════════════════════════════════════════════
       DISPAROS — redesign (wizard + cards). Todas as classes prefixadas bc-
       pra não conflitar com o resto. Mantém a paleta oficial do CRM.
       ═══════════════════════════════════════════════════════════════════ */
    .bc-display { font-family: 'Bricolage Grotesque', serif; font-variation-settings: "opsz" 96; letter-spacing: -0.02em; line-height: 1; }
    .bc-num { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; }

    /* Page header */
    .bc-page { max-width: 1180px; margin: 0 auto; padding: 28px 28px 80px; }
    .bc-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; gap: 24px; }
    .bc-header h1 { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.035em; color: var(--text-primary); margin: 0; }
    .bc-header-sub { font-size: 13px; color: var(--text-secondary); margin-top: 8px; max-width: 540px; line-height: 1.55; }

    .bc-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; border-radius: 10px; transition: all 0.14s var(--bc-easing); border: 1px solid transparent; white-space: nowrap; cursor: pointer; }
    .bc-btn svg { width: 14px; height: 14px; }
    .bc-btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .bc-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 8px 16px rgba(79,70,229,0.28); }
    .bc-btn-secondary { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
    .bc-btn-secondary:hover { background: var(--surface-2); border-color: var(--border-2); }
    .bc-btn-ghost { background: transparent; color: var(--text-secondary); }
    .bc-btn-ghost:hover { color: var(--text-primary); }

    /* Stats */
    .bc-stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; overflow: hidden; box-shadow: var(--bc-shadow-sm); }
    .bc-stat { padding: 18px 22px; border-right: 1px solid var(--border); }
    .bc-stat:last-child { border-right: none; }
    .bc-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
    .bc-stat-num { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 28px; color: var(--text-primary); letter-spacing: -0.025em; line-height: 1; }
    .bc-stat-delta { margin-top: 8px; font-size: 11px; color: var(--text-secondary); }
    .bc-stat-delta strong { color: var(--bc-success); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .bc-stat-delta.neg strong { color: var(--bc-danger); }

    /* Filters chips */
    .bc-filters-row { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .bc-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; font-size: 12px; color: var(--text-secondary); font-weight: 500; transition: all 0.14s var(--bc-easing); cursor: pointer; }
    .bc-chip:hover { background: var(--surface-2); color: var(--text-primary); }
    .bc-chip.active { background: var(--sidebar-bg); color: #fff; border-color: var(--sidebar-bg); }

    /* Campaign card */
    .bc-campaigns { display: flex; flex-direction: column; gap: 12px; }
    .bc-campaign { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; transition: all 0.18s var(--bc-easing); box-shadow: var(--bc-shadow-sm); position: relative; overflow: hidden; }
    .bc-campaign:hover { transform: translateY(-1px); box-shadow: var(--bc-shadow); border-color: var(--border-2); }
    .bc-campaign-running::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
    .bc-campaign-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .bc-campaign-title { font-family: 'Bricolage Grotesque', serif; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); margin-bottom: 4px; }
    .bc-campaign-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .bc-meta-dot { width: 3px; height: 3px; background: var(--text-muted); border-radius: 50%; display: inline-block; }

    .bc-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 100px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .bc-pill-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .bc-pill-RUNNING { background: var(--accent-soft); color: var(--accent); }
    .bc-pill-RUNNING .bc-pill-dot { background: var(--accent); animation: bcPulse 1.4s ease-in-out infinite; }
    .bc-pill-QUEUED  { background: var(--bc-warning-soft); color: var(--bc-warning); }
    .bc-pill-QUEUED .bc-pill-dot { background: var(--bc-warning); }
    .bc-pill-COMPLETED { background: var(--bc-success-soft); color: var(--bc-success); }
    .bc-pill-COMPLETED .bc-pill-dot { background: var(--bc-success); }
    .bc-pill-DRAFT { background: var(--surface-2); color: var(--text-secondary); }
    .bc-pill-DRAFT .bc-pill-dot { background: var(--text-muted); }
    .bc-pill-PAUSED { background: var(--bc-warning-soft); color: var(--bc-warning); }
    .bc-pill-PAUSED .bc-pill-dot { background: var(--bc-warning); }
    .bc-pill-FAILED { background: var(--bc-danger-soft); color: var(--bc-danger); }
    .bc-pill-FAILED .bc-pill-dot { background: var(--bc-danger); }

    @keyframes bcPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

    .bc-progress { height: 6px; background: var(--surface-2); border-radius: 100px; overflow: hidden; position: relative; margin-bottom: 14px; }
    .bc-progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-hover)); border-radius: 100px; position: relative; transition: width 0.6s var(--bc-easing); }
    .bc-progress-bar.running::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: bcShimmer 2s linear infinite; }
    @keyframes bcShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    .bc-cstats { display: flex; gap: 18px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .bc-cstat { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
    .bc-cstat-num { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; color: var(--text-primary); }
    .bc-cstat-label { color: var(--text-muted); font-weight: 500; }
    .bc-cstat.success .bc-cstat-num { color: var(--bc-success); }
    .bc-cstat.danger .bc-cstat-num { color: var(--bc-danger); }
    .bc-cstat.warn .bc-cstat-num { color: var(--bc-warning); }

    .bc-chtags { display: inline-flex; gap: 6px; margin-left: auto; }
    .bc-chtag { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .bc-chtag-wa { background: var(--brand-wa-soft); color: var(--brand-wa); }
    .bc-chtag-tg { background: var(--brand-tg-soft); color: var(--brand-tg); }

    .bc-actions { display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px; }
    .bc-action { padding: 7px 13px; font-size: 12px; font-weight: 600; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); transition: all 0.14s var(--bc-easing); display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
    .bc-action:hover { background: var(--surface-2); color: var(--text-primary); border-color: var(--border-2); }
    .bc-action svg { width: 12px; height: 12px; }
    .bc-action-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .bc-action-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
    .bc-action-success { background: var(--bc-success); color: #fff; border-color: var(--bc-success); }
    .bc-action-success:hover { background: #047857; border-color: #047857; color: #fff; }
    .bc-action-warn { background: var(--bc-warning); color: #fff; border-color: var(--bc-warning); }
    .bc-action-warn:hover { background: #b45309; border-color: #b45309; color: #fff; }
    .bc-action-danger { color: var(--bc-danger); }
    .bc-action-danger:hover { background: var(--bc-danger-soft); border-color: #fecaca; color: var(--bc-danger); }

    /* ─── Modal wizard ─── */
    .bc-backdrop { position: fixed; inset: 0; background: rgba(17,19,24,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; animation: bcBackdropIn 0.2s var(--bc-easing); }
    @keyframes bcBackdropIn { from { opacity: 0; } to { opacity: 1; } }
    .bc-modal { background: var(--surface); border-radius: 18px; width: 100%; max-width: 920px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: var(--bc-shadow-lg); overflow: hidden; animation: bcModalIn 0.32s var(--bc-easing); }
    @keyframes bcModalIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .bc-modal-head { padding: 20px 28px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
    .bc-modal-head h2 { font-family: 'Bricolage Grotesque', serif; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); margin: 0; }
    .bc-modal-head .bc-close { width: 32px; height: 32px; border-radius: 6px; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; transition: all 0.14s var(--bc-easing); background: transparent; border: none; cursor: pointer; }
    .bc-modal-head .bc-close:hover { background: var(--surface-2); color: var(--text-primary); }

    .bc-stepper { display: flex; align-items: center; padding: 0 28px; background: var(--surface-2); border-bottom: 1px solid var(--border); height: 60px; gap: 0; }
    .bc-step { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; transition: all 0.14s var(--bc-easing); padding: 8px 0; background: none; border: none; }
    .bc-step-num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--border-2); display: inline-flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--text-muted); flex-shrink: 0; transition: all 0.18s var(--bc-easing); }
    .bc-step-label { font-size: 12px; font-weight: 500; color: var(--text-muted); white-space: nowrap; transition: color 0.14s var(--bc-easing); }
    .bc-step.done .bc-step-num { background: var(--sidebar-bg); border-color: var(--sidebar-bg); color: #fff; }
    .bc-step.done .bc-step-label { color: var(--text-secondary); }
    .bc-step.active .bc-step-num { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
    .bc-step.active .bc-step-label { color: var(--text-primary); font-weight: 600; }
    .bc-step:not(:last-child)::after { content: ""; flex: 1; height: 1px; background: var(--border-2); margin: 0 14px; }
    .bc-step.done:not(:last-child)::after { background: var(--sidebar-bg); }

    .bc-modal-body { flex: 1; overflow-y: auto; padding: 28px; background: var(--surface); }
    .bc-modal-foot { padding: 16px 28px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); gap: 12px; }
    .bc-progress-text { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .bc-progress-text strong { color: var(--text-primary); }

    .bc-pane { display: none; animation: bcFadeSlide 0.24s var(--bc-easing); }
    .bc-pane.active { display: block; }
    @keyframes bcFadeSlide { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }

    .bc-pane-title { font-family: 'Bricolage Grotesque', serif; font-size: 26px; font-weight: 700; letter-spacing: -0.025em; color: var(--text-primary); margin: 0 0 6px; }
    .bc-pane-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; max-width: 560px; }

    .bc-twocol { display: grid; grid-template-columns: 1fr 320px; gap: 28px; align-items: flex-start; }
    .bc-side { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 22px; position: sticky; top: 0; }
    .bc-count-main { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 54px; color: var(--text-primary); letter-spacing: -0.04em; line-height: 1; margin: 12px 0 4px; transition: color 0.18s var(--bc-easing); }
    .bc-count-main.flash { color: var(--accent); }
    .bc-count-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-bottom: 12px; }
    .bc-breakdown { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-2); display: flex; flex-direction: column; gap: 10px; }
    .bc-breakdown-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
    .bc-breakdown-channel { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-weight: 500; }
    .bc-bd-bar-wrap { margin-top: 4px; height: 4px; background: var(--surface-3); border-radius: 100px; overflow: hidden; }
    .bc-bd-bar { height: 100%; border-radius: 100px; transition: width 0.5s var(--bc-easing); }
    .bc-chicon { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; }
    .bc-chicon-wa { background: var(--brand-wa); }
    .bc-chicon-tg { background: var(--brand-tg); }

    .bc-fsection { margin-bottom: 24px; }
    .bc-flabel { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .bc-flabel-meta { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); text-transform: none; letter-spacing: 0; font-weight: 500; }
    .bc-tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
    .bc-tag { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 100px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); font-weight: 500; transition: all 0.14s var(--bc-easing); user-select: none; cursor: pointer; }
    .bc-tag:hover { border-color: var(--border-2); color: var(--text-primary); }
    .bc-tag.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .bc-tag-x { width: 12px; height: 12px; display: none; color: rgba(255,255,255,0.55); }
    .bc-tag.on .bc-tag-x { display: inline-block; }

    /* Type cards */
    .bc-typecards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .bc-typecard { padding: 18px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; transition: all 0.16s var(--bc-easing); text-align: left; position: relative; }
    .bc-typecard:hover { border-color: var(--border-2); transform: translateY(-1px); }
    .bc-typecard.on { border-color: var(--accent); background: var(--accent-softer); box-shadow: 0 0 0 3px var(--accent-soft); }
    .bc-typecard-ic { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
    .bc-typecard.on .bc-typecard-ic { background: var(--accent); color: #fff; }
    .bc-typecard-t { font-weight: 600; font-size: 14px; margin-bottom: 3px; color: var(--text-primary); }
    .bc-typecard-d { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
    .bc-typecard.on .bc-typecard-d { color: var(--text-secondary); }

    /* Inputs */
    .bc-field { margin-bottom: 18px; }
    .bc-field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; display: block; }
    .bc-input, .bc-textarea, .bc-select { width: 100%; padding: 11px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; color: var(--text-primary); transition: all 0.14s var(--bc-easing); outline: none; font-family: inherit; box-sizing: border-box; }
    .bc-input:focus, .bc-textarea:focus, .bc-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .bc-textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
    .bc-input-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bc-varchip { padding: 2px 7px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.14s var(--bc-easing); border: none; }
    .bc-varchip:hover { background: var(--accent); color: #fff; }

    /* Phone preview */
    .bc-phone { background: var(--sidebar-bg); border-radius: 12px; padding: 18px; color: #fff; position: sticky; top: 0; box-shadow: 0 6px 20px rgba(17,19,24,0.18); }
    .bc-phone-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .bc-phone-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: #fff; }
    .bc-phone-name { font-size: 13px; font-weight: 600; }
    .bc-phone-status { font-size: 10px; color: rgba(255,255,255,0.5); }
    .bc-bubble { background: var(--accent); padding: 12px 14px; border-radius: 14px; border-bottom-right-radius: 4px; font-size: 13px; line-height: 1.45; margin-left: 32px; white-space: pre-wrap; word-break: break-word; color: #fff; }
    .bc-bubble-meta { text-align: right; margin-top: 4px; margin-right: 4px; font-size: 10px; color: rgba(255,255,255,0.5); }
    .bc-var-token { background: rgba(255,255,255,0.22); padding: 1px 6px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 11px; }

    /* Connection cards */
    .bc-connsec { margin-bottom: 24px; }
    .bc-connsec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .bc-connsec-head .bc-chicon { width: 22px; height: 22px; border-radius: 5px; }
    .bc-connsec-title { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; color: var(--text-primary); }
    .bc-connsec-meta { font-size: 11px; color: var(--text-muted); margin-left: auto; font-family: 'JetBrains Mono', monospace; }
    .bc-conncard { display: flex; align-items: center; gap: 14px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.14s var(--bc-easing); margin-bottom: 8px; }
    .bc-conncard:hover { border-color: var(--border-2); }
    .bc-conncard.on { border-color: var(--accent); background: var(--accent-softer); box-shadow: 0 0 0 3px var(--accent-soft); }
    .bc-conn-check { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border-2); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; transition: all 0.14s var(--bc-easing); flex-shrink: 0; color: #fff; }
    .bc-conncard.on .bc-conn-check { background: var(--accent); border-color: var(--accent); }
    .bc-conn-check svg { opacity: 0; transition: opacity 0.14s; width: 11px; height: 11px; }
    .bc-conncard.on .bc-conn-check svg { opacity: 1; }
    .bc-conncard-info { flex: 1; min-width: 0; }
    .bc-conncard-name { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .bc-conncard-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .bc-health-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bc-success); box-shadow: 0 0 0 3px rgba(5,150,105,0.18); }
    .bc-quality { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; padding: 2px 6px; border-radius: 3px; background: var(--bc-success-soft); color: var(--bc-success); }

    .bc-routing { background: var(--accent-softer); border: 1px solid var(--accent-soft); border-radius: 10px; padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-top: 16px; }
    .bc-routing svg { flex-shrink: 0; width: 18px; height: 18px; color: var(--accent); }
    .bc-routing strong { color: var(--text-primary); }

    .bc-sched-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .bc-toggle-card { padding: 20px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; transition: all 0.16s var(--bc-easing); text-align: left; }
    .bc-toggle-card:hover { border-color: var(--border-2); }
    .bc-toggle-card.on { border-color: var(--accent); background: var(--accent-softer); box-shadow: 0 0 0 3px var(--accent-soft); }
    .bc-toggle-circle { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
    .bc-toggle-card.on .bc-toggle-circle { background: var(--accent); color: #fff; }
    .bc-toggle-tt { font-weight: 700; font-size: 16px; margin-bottom: 4px; font-family: 'Bricolage Grotesque', serif; letter-spacing: -0.01em; color: var(--text-primary); }
    .bc-toggle-td { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .bc-toggle-card.on .bc-toggle-td { color: var(--text-secondary); }

    .bc-sched-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .bc-slider-wrap { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .bc-slider-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .bc-slider-row strong { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text-primary); }

    .bc-review { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
    .bc-review-row { display: flex; align-items: flex-start; padding: 14px 0; border-bottom: 1px dashed var(--border-2); gap: 16px; }
    .bc-review-row:first-child { padding-top: 0; }
    .bc-review-row:last-child { border-bottom: none; padding-bottom: 0; }
    .bc-review-key { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--text-muted); width: 130px; flex-shrink: 0; padding-top: 2px; }
    .bc-review-val { flex: 1; font-size: 13px; color: var(--text-primary); line-height: 1.55; }
    .bc-review-big { font-family: 'Bricolage Grotesque', serif; font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -0.025em; color: var(--text-primary); }
    .bc-review-bubble { background: var(--accent); color: #fff; padding: 12px 14px; border-radius: 12px; border-bottom-right-radius: 4px; font-size: 13px; line-height: 1.45; max-width: 320px; }

    .bc-send-cta { background: var(--accent); color: #fff; border: none; padding: 14px 24px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.16s var(--bc-easing); }
    .bc-send-cta:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(79,70,229,0.32); }

    .bc-helper-banner { background: var(--bc-warning-soft); border-radius: 10px; padding: 12px 14px; font-size: 12px; color: var(--bc-warning); display: flex; align-items: center; gap: 8px; margin-top: 14px; }

    @media (max-width: 820px) {
      .bc-twocol { grid-template-columns: 1fr; }
      .bc-side { position: static; }
      .bc-stats { grid-template-columns: repeat(2, 1fr); }
      .bc-stat:nth-child(2) { border-right: none; }
      .bc-stat:nth-child(1), .bc-stat:nth-child(2) { border-bottom: 1px solid var(--border); }
      .bc-sched-fields { grid-template-columns: 1fr; }
      .bc-typecards { grid-template-columns: 1fr; }
    }

    /* ═══════════════════════════════════════════════════════════════════
       DISPAROS v2 — hero, live strip, horizontal cards, side-panel modal
       ═══════════════════════════════════════════════════════════════════ */

    /* Hero card */
    .bc-hero { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px 28px 0; overflow: hidden; box-shadow: var(--bc-shadow-sm); margin-bottom: 18px; }
    .bc-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 0% 0%, rgba(79,70,229,0.06), transparent 55%); pointer-events: none; }
    .bc-hero-grid { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: flex-start; position: relative; z-index: 1; }
    .bc-hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; color: var(--accent); margin-bottom: 10px; }
    .bc-hero-eyebrow .bc-pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,0.18); animation: bcPulse 1.6s ease-in-out infinite; }
    .bc-hero h1 { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 42px; line-height: 1; letter-spacing: -0.04em; color: var(--text-primary); margin: 0 0 10px; }
    .bc-hero p { font-size: 13.5px; color: var(--text-secondary); max-width: 520px; line-height: 1.6; margin: 0; }
    .bc-hero-cta { display: flex; gap: 10px; align-items: center; }
    .bc-hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 28px; border-top: 1px solid var(--border); position: relative; z-index: 1; }
    .bc-hstat { padding: 18px 22px 22px; border-right: 1px solid var(--border); position: relative; }
    .bc-hstat:last-child { border-right: none; }
    .bc-hstat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .bc-hstat-value { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 30px; letter-spacing: -0.03em; line-height: 1; color: var(--text-primary); display: flex; align-items: baseline; gap: 6px; }
    .bc-hstat-value .bc-unit { font-size: 14px; font-weight: 500; color: var(--text-muted); font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0; }
    .bc-hstat-trend { margin-top: 8px; font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .bc-hstat-trend .bc-delta { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .bc-hstat-trend.up .bc-delta { color: var(--bc-success); }
    .bc-hstat-trend.dn .bc-delta { color: var(--bc-danger); }
    .bc-spark { height: 24px; width: 80px; margin-top: 10px; color: var(--accent); }

    /* Live strip */
    .bc-live-strip { display: flex; align-items: center; gap: 14px; padding: 11px 16px; background: linear-gradient(180deg, #0f1117 0%, #15171f 100%); color: #e6e8ef; border-radius: 14px; margin-bottom: 22px; font-size: 12.5px; box-shadow: var(--bc-shadow); position: relative; overflow: hidden; }
    .bc-live-strip::before { content: ""; position: absolute; left: -40%; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(79,70,229,0.18), transparent); animation: bcSweep 6s linear infinite; }
    @keyframes bcSweep { to { left: 130%; } }
    .bc-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; flex-shrink: 0; box-shadow: 0 0 0 4px rgba(239,68,68,0.18); animation: bcPulse 1.2s ease-in-out infinite; }
    .bc-live-label { font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; color: #94a3b8; }
    .bc-live-msg { color: #fff; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
    .bc-live-msg .bc-lead-name { font-weight: 600; }
    .bc-live-msg .bc-msg-snippet { color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bc-live-msg .bc-ch-tag { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
    .bc-ch-tag.wa { background: rgba(22,163,74,0.20); color: #86efac; }
    .bc-ch-tag.tg { background: rgba(14,165,233,0.20); color: #7dd3fc; }
    .bc-live-throughput { display: flex; align-items: center; gap: 6px; color: #94a3b8; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
    .bc-live-throughput strong { color: #fff; font-weight: 600; }

    /* Toolbar (filters + search) */
    .bc-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 14px; }
    .bc-chip-count { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--text-muted); }
    .bc-chip.active .bc-chip-count { background: rgba(255,255,255,0.15); color: #fff; }
    .bc-search-box { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 240px; transition: all 0.14s var(--bc-easing); }
    .bc-search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,70,229,0.18); }
    .bc-search-box svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .bc-search-box input { flex: 1; border: none; outline: none; background: transparent; font-size: 12.5px; color: var(--text-primary); }

    /* Card horizontal row */
    .bc-card-row { display: grid; grid-template-columns: 1.4fr 0.7fr 1fr 1fr auto; gap: 24px; align-items: center; }
    .bc-c-name-block { min-width: 0; }
    .bc-c-name { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; color: var(--text-primary); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .kb-shell { display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--surface-2); }

    /* ═══════════════════════════════════════════════════════════════════
       SIDEBAR — redesign (hover-to-expand + pin). Prefixo sb-
       ═══════════════════════════════════════════════════════════════════ */
    :root {
      --sb-bg:        #0e1014;
      --sb-fg:        #e5e7eb;
      --sb-mute:      #6b7280;
      --sb-hover:     rgba(255,255,255,0.05);
      --sb-divider:   rgba(255,255,255,0.06);
      --sb-glow:      rgba(99,102,241,0.18);
    }
    .sb { width: 64px; background: var(--sb-bg); color: var(--sb-fg); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--sb-divider); transition: width 0.22s var(--bc-easing); position: relative; overflow: hidden; }
    .sb.expanded { width: 220px; }

    .sb-toggle { position: absolute; top: 24px; right: -10px; width: 20px; height: 20px; background: var(--sb-bg); border: 1px solid var(--sb-divider); border-radius: 50%; color: var(--sb-fg); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: all 0.14s ease; opacity: 0; padding: 0; }
    .sb:hover .sb-toggle, .sb.pinned .sb-toggle { opacity: 1; }
    .sb-toggle:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sb.pinned .sb-toggle { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sb-toggle svg { width: 11px; height: 11px; transition: transform 0.22s ease; }
    .sb.expanded .sb-toggle svg { transform: rotate(180deg); }

    .sb-logo { height: 60px; display: flex; align-items: center; justify-content: center; padding: 0 14px; flex-shrink: 0; gap: 0; border-bottom: 1px solid var(--sb-divider); transition: gap 0.18s ease; }
    .sb.expanded .sb-logo { gap: 10px; }
    .sb-logo-mark { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 10px rgba(79,70,229,0.32), inset 0 1px 0 rgba(255,255,255,0.18); }
    .sb-logo-mark svg { width: 18px; height: 18px; color: #fff; }
    .sb-logo-name { font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 17px; letter-spacing: -0.025em; color: #fff; opacity: 0; max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width 0.22s ease, opacity 0.18s ease; }
    .sb.expanded .sb-logo-name { opacity: 1; max-width: 200px; }

    .sb-ws { margin: 12px 12px 6px; padding: 7px 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 9px; display: flex; align-items: center; gap: 8px; overflow: hidden; flex-shrink: 0; cursor: pointer; transition: background 0.14s ease; }
    .sb-ws:hover { background: rgba(255,255,255,0.07); }
    .sb-ws-mark { width: 22px; height: 22px; border-radius: 5px; background: var(--sb-glow); color: var(--accent-light); font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 10.5px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; text-transform: uppercase; }
    .sb-ws-info { flex: 1; min-width: 0; opacity: 0; max-width: 0; overflow: hidden; transition: max-width 0.22s ease, opacity 0.18s ease; }
    .sb.expanded .sb-ws-info { opacity: 1; max-width: 200px; }
    .sb-ws-name { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-ws-label { font-size: 10px; color: var(--sb-mute); }
    .sb-ws-chev { width: 12px; height: 12px; color: var(--sb-mute); flex-shrink: 0; opacity: 0; transition: opacity 0.18s ease; }
    .sb.expanded .sb-ws-chev { opacity: 1; }

    .sb-section { margin: 0 14px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--sb-mute); opacity: 0; transition: opacity 0.18s ease; height: 0; overflow: hidden; padding-left: 4px; }
    .sb.expanded .sb-section { opacity: 1; height: auto; margin: 14px 14px 6px; }

    .sb-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 8px 4px; display: flex; flex-direction: column; gap: 2px; }
    .sb-nav::-webkit-scrollbar { width: 0; }

    .sb-item { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 8px; color: var(--sb-mute); cursor: pointer; transition: all 0.14s var(--bc-easing); position: relative; text-decoration: none; white-space: nowrap; border: none; background: transparent; width: 100%; font-family: inherit; }
    .sb-item:hover { background: var(--sb-hover); color: var(--sb-fg); }
    .sb-item.active { color: #fff; background: var(--sb-glow); }

    .sb-foot { border-top: 1px solid var(--sb-divider); padding: 8px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }

    .sb-user-av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #818cf8 0%, #4f46e5 100%); color: #fff; font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sb-user-info { flex: 1; min-width: 0; opacity: 0; max-width: 0; overflow: hidden; transition: max-width 0.22s ease, opacity 0.18s ease; }

    .sb-user-name { font-size: 12.5px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-user-role { font-size: 10.5px; color: var(--sb-mute); }

    /* ═══════════════════════════════════════════════════════════════════
       CONVERSAS — redesign (lista, chat, detalhes). Prefixo cv-
       Fase 1: lista de conversas
       ═══════════════════════════════════════════════════════════════════ */
    .cv-list-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .cv-list-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cv-list-title { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; color: var(--text-primary); }
    .cv-list-count { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .cv-list-search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 0 10px; transition: border-color 0.14s var(--bc-easing); }
    .cv-list-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
    .cv-list-search:focus-within input { box-shadow: none; }
    .cv-list-search svg { width: 13px; height: 13px; color: var(--text-muted); flex-shrink: 0; }
    .cv-list-search input { flex: 1; border: none; outline: none; padding: 8px 0; font-size: 13px; background: transparent; color: var(--text-primary); font-family: inherit; }
    .cv-list-search input:focus { box-shadow: none; }
    .cv-list-search-clear { width: 18px; height: 18px; border-radius: 50%; background: var(--text-muted); color: white; border: none; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0; font-size: 10px; display: inline-flex; align-items: center; justify-content: center; }

    .cv-fil-row { display: flex; gap: 6px; padding: 10px 14px 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
    .cv-fil-row::-webkit-scrollbar { display: none; }
    .cv-fil-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 100px; font-size: 11.5px; color: var(--text-muted); font-weight: 500; cursor: pointer; transition: all 0.14s var(--bc-easing); white-space: nowrap; border: 1px solid transparent; background: transparent; font-family: inherit; }
    .cv-fil-chip:hover { background: var(--surface-2); color: var(--text-primary); }
    .cv-fil-chip.active { background: var(--accent); color: #fff; }
    .cv-fil-count { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--text-muted); line-height: 1.4; }
    .cv-fil-chip:hover .cv-fil-count { background: var(--surface-3); color: var(--text-secondary); }
    .cv-fil-chip.active .cv-fil-count { background: rgba(255,255,255,0.18); color: #fff; }
    .cv-list-count.has-unread { color: var(--text-secondary); font-weight: 500; }

    .cv-conv {
      display: flex; gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.12s var(--bc-easing);
      margin: 0 6px 2px;
      position: relative;
      border-bottom: none;
    }
    .cv-conv:hover { background: var(--surface-2); }
    .cv-conv.active { background: var(--accent-softer); }
    .cv-conv.active::before {
      content: "";
      position: absolute;
      left: -6px; top: 8px; bottom: 8px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }
    .cv-conv-av-wrap { position: relative; flex-shrink: 0; }
    .cv-conv-ch {
      position: absolute;
      bottom: -2px; right: -2px;
      width: 18px; height: 18px;
      border-radius: 6px;
      color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px;
      font-weight: 700;
      border: 2px solid var(--surface);
      font-family: 'JetBrains Mono', monospace;
    }
    .cv-conv.active .cv-conv-ch { border-color: var(--accent-softer); }
    .cv-conv-ch.wa { background: var(--brand-wa); }
    .cv-conv-ch.tg { background: var(--brand-tg); }
    .cv-conv-info { flex: 1; min-width: 0; }
    .cv-conv-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
    .cv-conv-name-wrap { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
    .cv-conv-name { font-size: 13.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .cv-conv-name.unread { font-weight: 700; }
    .cv-conv-name.read { color: var(--text-secondary); font-weight: 500; }
    .cv-conv-time { font-size: 10.5px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; flex-shrink: 0; font-weight: 500; }
    .cv-conv-row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cv-conv-preview {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.35;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 400;
      min-width: 0;
    }
    .cv-conv-preview.unread { color: var(--text-primary); font-weight: 500; }
    .cv-conv-preview .me { color: var(--text-muted); }
    .cv-conv-unread {
      background: var(--accent);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 0 6px;
      height: 18px;
      min-width: 20px;
      border-radius: 100px;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(79,70,229,0.32);
    }
    .cv-conv-icons { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .cv-conv-icons svg { width: 11px; height: 11px; flex-shrink: 0; }

    .cv-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); }
    .cv-empty svg { width: 40px; height: 40px; margin: 0 auto 10px; opacity: 0.22; display: block; }
    .cv-empty p { font-size: 13px; }

    /* Fase 2: chat header */
    .cv-chat-head { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #fff; border-bottom: 1px solid var(--border); flex-shrink: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .cv-chat-head-av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 13px; flex-shrink: 0; position: relative; }
    .cv-chat-head-av-ch { position: absolute; bottom: -1px; right: -1px; width: 16px; height: 16px; border-radius: 5px; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 8.5px; font-weight: 700; border: 2px solid #fff; font-family: 'JetBrains Mono', monospace; }
    .cv-chat-head-av-ch.wa { background: var(--brand-wa); }
    .cv-chat-head-av-ch.tg { background: var(--brand-tg); }
    .cv-chat-head-info { flex: 1; min-width: 0; }
    .cv-chat-head-name-row { display: flex; align-items: center; gap: 8px; min-width: 0; }

    .cv-chat-head-channel { font-size: 9.5px; padding: 2px 7px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0; }

    .cv-chat-head-channel.tg { background: var(--brand-tg-soft); color: var(--brand-tg); }
    .cv-chat-head-status { font-size: 11.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
    .cv-chat-head-online-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bc-success); box-shadow: 0 0 0 2px var(--bc-success-soft); flex-shrink: 0; }
    .cv-chat-head-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .cv-chat-head-btn { width: 34px; height: 34px; border-radius: 8px; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.14s var(--bc-easing); background: transparent; border: none; }
    .cv-chat-head-btn:hover { background: var(--surface-2); color: var(--text-primary); }
    .cv-chat-head-btn.active { background: var(--accent-soft); color: var(--accent); }
    .cv-chat-head-btn.danger:hover { background: var(--bc-danger-soft); color: var(--bc-danger); }
    .cv-chat-head-btn.starred { color: var(--bc-warning); background: transparent; }
    .cv-chat-head-btn.starred:hover { color: var(--bc-warning); background: var(--bc-warning-soft); }
    .cv-chat-head-btn.unread { color: var(--bc-warning); background: transparent; }
    .cv-chat-head-btn.unread:hover { color: var(--bc-warning); background: var(--bc-warning-soft); }
    .cv-chat-head-btn svg { width: 17px; height: 17px; }
    .cv-chat-head-read-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; font-size: 11.5px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.14s var(--bc-easing); border: 1px solid; }
    .cv-chat-head-read-btn svg { width: 12px; height: 12px; }
    .cv-chat-head-read-btn.unread { background: var(--warning-soft); color: var(--warning); border-color: #fde68a; }
    .cv-chat-head-read-btn.unread:hover { background: var(--warning); color: #fff; border-color: var(--warning); }
    .cv-chat-head-read-btn.read { background: var(--success-soft); color: var(--success); border-color: #bbf7d0; }
    .cv-chat-head-read-btn.read:hover { background: var(--warning-soft); color: var(--warning); border-color: #fde68a; }

    /* Fase 3: bubbles + day dividers */
    #conv-msgs { background: var(--surface-2); }
    #inbox-chat-area { background: var(--surface-2) !important; }

    .cv-day-sep { display: flex; align-items: center; gap: 12px; margin: 14px 0 8px; }
    .cv-day-sep::before, .cv-day-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .cv-day-sep-label { font-size: 11px; color: var(--text-muted); font-weight: 600; background: var(--surface); padding: 4px 11px; border-radius: 100px; border: 1px solid var(--border); white-space: nowrap; }

    .cv-unread-sep { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
    .cv-unread-sep::before, .cv-unread-sep::after { content: ""; flex: 1; height: 1px; background: var(--accent-light); opacity: 0.4; }
    .cv-unread-sep-label { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 3px 10px; border-radius: 100px; letter-spacing: 0.04em; white-space: nowrap; }

    /* Fase 4: composer — pill de conexão custom (sem <select> nativo) */
    .cv-conn-pill {
      flex: 1; min-width: 0; position: relative;
    }
    .cv-conn-pill-btn {
      display: flex; align-items: center; gap: 7px;
      width: 100%; min-width: 0;
      padding: 3px 9px 3px 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.14s var(--bc-easing), border-color 0.14s var(--bc-easing);
    }
    .cv-conn-pill-btn:hover { background: var(--surface); border-color: var(--border-2); }
    .cv-conn-pill-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .cv-conn-pill[data-open="1"] .cv-conn-pill-btn { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .cv-conn-pill-icon {
      width: 20px; height: 20px; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #fff;
      box-shadow: 0 1px 3px rgba(15,17,23,0.10);
    }
    .cv-conn-pill-icon svg { width: 11px; height: 11px; }
    .cv-conn-pill-icon.tg { background: linear-gradient(135deg, #0ea5e9, #38bdf8); }
    .cv-conn-pill-icon.wa { background: linear-gradient(135deg, #16a34a, #22c55e); }
    .cv-conn-pill-icon.wa-web { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .cv-conn-pill-icon.empty { background: linear-gradient(135deg, var(--text-muted), var(--text-secondary)); opacity: 0.5; }
    /* CTA quando workspace ainda não tem nenhuma conexão — leva pra /conexoes */
    .cv-conn-pill.no-conn .cv-conn-pill-btn {
      background: var(--accent-soft);
      border-color: var(--accent);
      border-style: dashed;
    }
    .cv-conn-pill.no-conn .cv-conn-pill-btn:hover {
      background: var(--accent);
      border-style: solid;
    }
    .cv-conn-pill.no-conn .cv-conn-pill-btn:hover .cv-conn-pill-name,
    .cv-conn-pill.no-conn .cv-conn-pill-btn:hover .cv-conn-pill-icon { color: #fff; }

      background: transparent;
      box-shadow: none;
      color: var(--accent);
      opacity: 1;
    }
    .cv-conn-pill.no-conn .cv-conn-pill-name { color: var(--accent); font-weight: 700; }
    .cv-conn-pill-name {
      flex: 1; min-width: 0;
      font-size: 12px; font-weight: 600; color: var(--text-primary);
      line-height: 1.2;
      text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cv-conn-pill .cv-conn-chev {
      width: 10px; height: 10px; color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.16s var(--bc-easing), color 0.14s var(--bc-easing);
    }
    .cv-conn-pill[data-open="1"] .cv-conn-chev { transform: rotate(180deg); color: var(--accent); }
    .cv-conn-pill-btn:hover .cv-conn-chev { color: var(--text-primary); }

    /* Painel dropdown */
    .cv-conn-drop {
      position: fixed; z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 14px 36px rgba(15,17,23,0.12), 0 4px 12px rgba(15,17,23,0.06);
      min-width: 280px;
      max-width: 360px;
      max-height: 320px;
      overflow-y: auto;
      animation: cvConnDropIn 0.14s var(--bc-easing);
    }
    @keyframes cvConnDropIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .cv-conn-drop-label {
      font-size: 10px; font-weight: 700;

      color: var(--text-muted); font-size: 12.5px;
    }

      display: flex; align-items: center; gap: 10px;
      padding: 7px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      position: relative;
    }
    .cv-conn-drop-item:hover { background: var(--surface-2); }
    .cv-conn-drop-item:active { transform: scale(0.99); }
    .cv-conn-drop-item.active { background: var(--accent-soft); }
    .cv-conn-drop-item.active::before {
      content: ""; position: absolute;
      left: -6px; top: 8px; bottom: 8px;
      width: 3px; border-radius: 0 3px 3px 0;
      background: var(--accent);
    }
    .cv-conn-drop-item-info { flex: 1; min-width: 0; }
    .cv-conn-drop-item-name {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      line-height: 1.25;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cv-conn-drop-item-sub {
      font-size: 11px; color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.01em;
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cv-conn-drop-status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--bc-success);
      box-shadow: 0 0 0 3px rgba(22,163,74,0.18);
      flex-shrink: 0;
    }
    .cv-conn-drop-item-check {
      width: 16px; height: 16px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .cv-conn-drop-item-check svg { width: 16px; height: 16px; stroke-width: 3; }
    .cv-input-wrap {
      display: flex; align-items: flex-end; gap: 6px;

    }

    .cv-input-wrap textarea { flex: 1; font-size: 13.5px; border: none; outline: none; box-shadow: none; background: transparent; resize: none; min-height: 24px; max-height: 140px; font-family: inherit; color: var(--text-primary); line-height: 1.5; padding: 6px 0; box-sizing: border-box; }
    .cv-input-wrap textarea::placeholder { color: var(--text-muted); }
    .cv-action-btn { flex-shrink: 0; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: transparent; color: var(--text-muted); border: none; cursor: pointer; transition: background-color 0.12s var(--bc-easing), color 0.12s var(--bc-easing); }
    .cv-action-btn:hover { background: var(--surface-2); color: var(--text-primary); }
    .cv-action-btn svg { width: 17px; height: 17px; }
    .cv-send-btn { flex-shrink: 0; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--accent); color: #fff; border: none; cursor: pointer; transition: background-color 0.14s var(--bc-easing), transform 0.14s var(--bc-easing), box-shadow 0.14s var(--bc-easing); box-shadow: 0 4px 10px rgba(79,70,229,0.25); }

    /* ─── MOBILE: Conversas estilo Kommo (uma tela por vez) ─── */
    .cv-chat-head-back { display: none; }
    @media (max-width: 768px) {
      /* Trava o body — previne iOS scroll-bounce que descarrega o header
         após o teclado ser dispensado */
      html.has-mobile-inbox, body.has-mobile-inbox {
        overflow: hidden !important;
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100dvh !important;
      }

      /* Container raiz: dvh acompanha teclado iOS/Android (não 100vh estático) */
      body.has-mobile-inbox #app > div:first-child {
        height: 100dvh !important;
        max-height: 100dvh !important;
      }

      /* Sidebar desktop some completamente no mobile — usa bottom-nav */
      .sb { display: none !important; }

      /* Bottom nav aparece no mobile */
      .mob-bottom-nav { display: block; }
      /* Mas some quando conversa ativa (full-screen chat) */
      body.has-mobile-inbox.has-active-conv .mob-bottom-nav { display: none; }
      /* Reserva espaço pra bottom-nav (content-wrapper é o pai de tudo) */
      body:not(.has-active-conv) #content-wrapper { padding-bottom: calc(58px + env(safe-area-inset-bottom)); }

      /* Inbox panels: tela cheia, alternando */
      #inbox-list-panel { width: 100% !important; min-width: 0 !important; flex: 1 !important; border-right: none !important; }
      #inbox-chat-area { flex: 1; min-height: 0; }

      /* Default mobile: lista visível, chat e details escondidos */
      body.has-mobile-inbox:not(.has-active-conv) #inbox-chat-area { display: none !important; }
      body.has-mobile-inbox.has-active-conv #inbox-list-panel { display: none !important; }
      body.has-mobile-inbox.has-active-conv #inbox-chat-area { display: flex !important; }
      /* Durante swipe-back: lista visível atrás do chat (revela ao deslizar).
         Chat vai pra position:fixed pra cobrir a viewport inteira durante o gesto
         (senão flex divide o espaço com a list-panel e o chat shrink pra 50%). */
      body.has-mobile-inbox.has-active-conv.gesture-back-active #inbox-list-panel { display: flex !important; }
      body.has-mobile-inbox.has-active-conv.gesture-back-active #inbox-chat-area {
        position: fixed !important;
        inset: 0 !important;
        z-index: 50 !important;
        background: var(--surface) !important;
      }

      /* Header do chat sticky no topo — back button sempre acessível */
      body.has-mobile-inbox.has-active-conv #inbox-chat-header {
        position: sticky !important;
        top: 0 !important;
        z-index: 20 !important;
        background: var(--surface) !important;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }

      /* Composer sticky no rodapé — sempre visível com teclado aberto */
      body.has-mobile-inbox.has-active-conv #inbox-reply-box {
        position: sticky !important;
        bottom: 0 !important;
        z-index: 10 !important;
        background: var(--surface);
      }

      /* Mensagens: garante que pode encolher quando teclado abre.
         touch-action pan-y: browser só captura pan vertical (scroll natural);
         pan horizontal fica disponível pro nosso swipe handler em vez de ser
         interpretado como gesto do sistema (back nav, momentum scroll lateral). */
      body.has-mobile-inbox.has-active-conv #conv-msgs {
        min-height: 0;
        flex: 1;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      body.has-mobile-inbox.has-active-conv #inbox-chat-area {
        touch-action: pan-y;
      }

      /* Details panel: overlay full-screen com slide-in/out via CSS transition.
         Transition (não animation) evita o bounce — só dispara quando o valor de
         transform muda. Class .is-open controla aberto/fechado. .is-dragging
         desativa transition durante gesto pra acompanhar dedo em tempo real. */
      body.has-mobile-inbox #inbox-details-panel {
        position: fixed !important;
        inset: 0 !important;
        height: 100dvh !important;
        z-index: 100 !important;
        width: 100% !important;
        background: var(--surface) !important;
        transform: translateX(100%);
        transition: transform 0.22s cubic-bezier(0.32, 0.72, 0, 1);
      }
      body.has-mobile-inbox #inbox-details-panel.is-open {
        transform: translateX(0);
      }
      body.has-mobile-inbox #inbox-details-panel.is-dragging {
        transition: none !important;
      }

      /* Back button no chat header — destaque visual */
      .cv-chat-head-back { display: inline-flex !important; margin-right: 4px; }
      .cv-chat-head-back svg { width: 20px; height: 20px; }

      /* Touch-friendly: itens maiores na lista */
      .cv-conv { padding: 12px 12px; min-height: 60px; }
      .cv-conv-name { font-size: 14.5px; }
      .cv-conv-preview { font-size: 13px; }

      /* Header do chat compacto + back button */
      .cv-chat-head { padding: 10px 12px; gap: 8px; }
      .cv-chat-head-av { width: 38px; height: 38px; font-size: 12px; }
      .cv-chat-head-name { font-size: 14px; }
      .cv-chat-head-status { font-size: 11px; }
      /* Composer touch-friendly: mantem TODOS os botoes (audio, contato, agendar) acessiveis no mobile */
      .cv-input-wrap textarea { font-size: 16px !important; /* iOS evita zoom auto */ }
      .cv-input-wrap { padding: 8px 6px 8px 12px; min-height: 52px; gap: 2px; }
      .cv-action-btn { width: 32px; height: 32px; flex-shrink: 0; }
      .cv-action-btn svg { width: 17px; height: 17px; }
      .cv-send-btn { width: 38px; height: 38px; }

      /* Filtros chips um pouco maiores */
      .cv-fil-chip { font-size: 12.5px; padding: 6px 13px; }

      /* Detalhes (painel direito no desktop, overlay no mobile) */
      .det-shell { width: 100% !important; height: 100dvh; }
      .det-head { padding: 14px 16px 12px; }
      .det-quick { gap: 6px; }
      .det-q-btn { padding: 9px 4px; font-size: 11.5px; }

      /* Lista busca/filtros: ajuste de altura */
      .cv-list-head { padding: 12px 14px 10px; }
      .cv-list-search { padding: 0 12px; }
      .cv-list-search input { padding: 10px 0; font-size: 16px; /* iOS anti-zoom */ }

      /* ─── Kanban mobile ─── */
      .kb-page-head { padding: 16px 14px 12px; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
      .kb-page-h1 { font-size: 22px !important; }
      .kb-rail {
        display: grid !important; grid-template-columns: 1fr 1fr; gap: 0;
        padding: 0; border-bottom: 1px solid var(--border);
      }
      .kb-rail-item {
        flex: none !important; padding: 12px 14px !important;
        border-right: 1px solid var(--border) !important;
        border-bottom: 1px solid var(--border);
      }
      .kb-rail-item:nth-child(2n) { border-right: none !important; }
      .kb-rail-item:nth-last-child(-n+2) { border-bottom: none; }
      .kb-rail-num { font-size: 18px !important; }
      .kb-rail-meta { font-size: 10.5px !important; }
      .kb-board-wrap { padding: 14px 12px 70px; cursor: default !important; scroll-snap-type: x mandatory; }
      .kb-board-wrap .kb-card { cursor: pointer; }
      .kb-col { width: 86vw; max-width: 320px; scroll-snap-align: start; }
      .kb-add-stage { width: 86vw; max-width: 320px; }

      /* ─── Composer mobile compacto ─── */
      .cv-composer { padding: 8px 10px 10px !important; }
      /* Esconde a barra de canal+IA quando há só uma conexão (já evidente no header) */
      .cv-conn-pill-name { max-width: 130px; }
      .cv-input-wrap textarea { padding: 8px 4px; }
      /* Some o helper text "Enter pra enviar..." em telas curtas pra ganhar espaço */
      .cv-composer p { display: none; }

      /* ─── Telas de configurações / kanban / etc com padding compacto ─── */
      .cfg-shell, .cfg-page { padding: 14px !important; }
      .cn-page { padding: 14px !important; }
      .cn-tpl-page { padding: 14px !important; }
    }

    /* Telas muito estreitas (<400px): comprime ainda mais */
    @media (max-width: 400px) {
      .cv-conn-pill-name { max-width: 90px; font-size: 11.5px; }
      .cv-action-btn { width: 30px; height: 30px; }
      .cv-action-btn svg { width: 15px; height: 15px; }
      .cv-input-wrap { gap: 1px; padding: 6px 4px 6px 10px; }
    }

    /* Fase 5: details panel + financeiro */
    .det-shell { width: 320px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex: 1; min-height: 0; }
    .det-head { padding: 18px 18px 14px; text-align: center; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; }
    .det-close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 6px; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.14s var(--bc-easing); background: transparent; border: none; }
    .det-close:hover { background: var(--surface-2); color: var(--text-primary); }
    .det-close svg { width: 14px; height: 14px; }

    .det-av { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', serif; font-weight: 800; font-size: 22px; box-shadow: 0 6px 18px rgba(17,19,24,0.12); position: relative; }
    .det-av-ch { position: absolute; bottom: -2px; right: -2px; width: 22px; height: 22px; border-radius: 7px; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border: 2px solid var(--surface); }
    .det-av-ch.tg { background: var(--brand-tg); }
    .det-av-ch.wa { background: var(--brand-wa); }
    .det-name { font-family: 'Bricolage Grotesque', serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: var(--text-primary); margin-bottom: 4px; line-height: 1.2; }
    .det-handle { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-secondary); margin-bottom: 12px; }
    .det-quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .det-q-btn { padding: 8px 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; font-size: 11px; color: var(--text-secondary); font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: all 0.14s var(--bc-easing); font-family: inherit; }
    .det-q-btn:hover { background: var(--accent-softer); color: var(--accent); border-color: var(--accent-light); }
    .det-q-btn svg { width: 16px; height: 16px; }

    .det-body { flex: 1; overflow-y: auto; padding: 0; }

    .det-section:last-child { border-bottom: none; }
    .det-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .det-label-add { color: var(--accent); cursor: pointer; font-size: 16px; line-height: 1; opacity: 0.6; background: transparent; border: none; padding: 0; }

    .det-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 100px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.14s var(--bc-easing); background: var(--surface-2); border: 1px solid transparent; color: var(--text-secondary); font-family: inherit; }
    .det-pill:hover { border-color: var(--border-2); background: var(--surface); color: var(--text-primary); }
    .det-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .det-pill svg { width: 10px; height: 10px; opacity: 0.5; flex-shrink: 0; }

    /* ── IA Agent section (Phase 1) ──────────────────────────────────── */
    .det-ai-card { padding: 14px 16px; border-bottom: 1px solid var(--surface-3); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 4%, transparent), transparent); }

    .det-ai-head-ic { width: 22px; height: 22px; border-radius: 7px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .det-ai-status .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px currentColor; opacity: 0.95; animation: detAiPulse 2.4s ease-in-out infinite; }
