<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Super Admin — Gestão de Workspaces</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [x-cloak]{display:none}
    .fade{animation:fadeIn .15s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  </style>
</head>
<body class="bg-gray-50 text-gray-900">

<div id="app"></div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const API = '/api/v1/super'

// ─── State ────────────────────────────────────────────────────────────────────
let S = {
  view: 'loading',   // loading | setup | login | dashboard
  token: localStorage.getItem('superToken') || '',
  workspaces: [],
  selectedWorkspace: null,   // workspace detail / users view
  wsUsers: [],
  wsUsersLoading: false,
  form: {},
  formError: '',
  modal: null,   // 'create_ws' | 'edit_ws' | 'delete_ws' | 'view_users'
  deleteTarget: null,
  loading: false,
  toast: '',
  toastTimer: null,
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(s='') { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

async function api(path, opts={}) {
  const headers = { 'Content-Type': 'application/json', ...(S.token ? { Authorization: `Bearer ${S.token}` } : {}) }
  const res = await fetch(API + path, { ...opts, headers })
  if (!res.ok) {
    const err = await res.json().catch(()=>({ message: res.statusText }))
    throw new Error(err.message || 'Erro desconhecido')
  }
  if (res.status === 204) return null
  return res.json()
}

function go(view) { S.view = view; render() }

function showToast(msg) {
  clearTimeout(S.toastTimer)
  S.toast = msg; render()
  S.toastTimer = setTimeout(() => { S.toast = ''; render() }, 3000)
}

function closeModal() { S.modal = null; S.form = {}; S.formError = ''; render() }

// ─── Boot ─────────────────────────────────────────────────────────────────────
async function boot() {
  const { exists } = await api('/auth/check').catch(() => ({ exists: true }))
  if (!S.token) { go(exists ? 'login' : 'setup'); return }
  try {
    await fetchWorkspaces()
    go('dashboard')
  } catch {
    S.token = ''; localStorage.removeItem('superToken'); go(exists ? 'login' : 'setup')
  }
}

async function fetchWorkspaces() {
  S.workspaces = await api('/workspaces')
}

// ─── Auth ─────────────────────────────────────────────────────────────────────
async function submitSetup() {
  const { name, email, password } = S.form
  if (!name?.trim()||!email?.trim()||!password) { S.formError='Preencha todos os campos.'; render(); return }
  try {
    const r = await api('/auth/setup', { method:'POST', body: JSON.stringify({ name: name.trim(), email: email.trim(), password }) })
    S.token = r.token; localStorage.setItem('superToken', r.token)
    S.form = {}; S.formError = ''
    await fetchWorkspaces()
    go('dashboard')
  } catch(e) { S.formError = e.message; render() }
}

async function submitLogin() {
  const { email, password } = S.form
  if (!email?.trim()||!password) { S.formError='Preencha e-mail e senha.'; render(); return }
  try {
    const r = await api('/auth/login', { method:'POST', body: JSON.stringify({ email: email.trim(), password }) })
    S.token = r.token; localStorage.setItem('superToken', r.token)
    S.form = {}; S.formError = ''
    await fetchWorkspaces()
    go('dashboard')
  } catch(e) { S.formError = e.message; render() }
}

function logout() {
  S.token = ''; localStorage.removeItem('superToken')
  S.workspaces = []; S.selectedWorkspace = null
  go('login')
}

// ─── Workspace actions ────────────────────────────────────────────────────────
function openCreateWorkspace() {
  S.form = {}; S.formError = ''; S.modal = 'create_ws'; render()
}

function openEditWorkspace(ws) {
  S.form = { name: ws.name, isActive: ws.isActive, _id: ws.id }
  S.formError = ''; S.modal = 'edit_ws'; render()
}

function openDeleteWorkspace(ws) {
  S.deleteTarget = ws; S.modal = 'delete_ws'; render()
}

async function openWorkspaceUsers(ws) {
  S.selectedWorkspace = ws; S.wsUsers = []; S.wsUsersLoading = true; S.modal = 'view_users'; render()
  try {
    S.wsUsers = await api(`/workspaces/${ws.id}/users`)
  } catch(e) { S.formError = e.message }
  S.wsUsersLoading = false; render()
}

async function accessWorkspace(ws) {
  try {
    const r = await api(`/workspaces/${ws.id}/impersonate`, { method: 'POST', body: '{}' })
    localStorage.setItem('leads_jwt', r.token)
    localStorage.setItem('leads_user', JSON.stringify(r.user))
    localStorage.setItem('workspaceSlug', r.workspaceSlug)
    window.open('/leads/', '_blank')
  } catch(e) { alert(e.message) }
}

async function submitCreateWorkspace() {
  const { name, slug, adminName, adminEmail, adminPassword } = S.form
  if (!name?.trim()||!slug?.trim()||!adminName?.trim()||!adminEmail?.trim()||!adminPassword) {
    S.formError = 'Preencha todos os campos obrigatórios.'; render(); return
  }
  try {
    await api('/workspaces', { method:'POST', body: JSON.stringify({
      name: name.trim(), slug: slug.trim(),
      adminName: adminName.trim(), adminEmail: adminEmail.trim(), adminPassword
    }) })
    await fetchWorkspaces()
    closeModal()
    showToast('Workspace criado com sucesso')
  } catch(e) { S.formError = e.message; render() }
}

async function submitEditWorkspace() {
  const { name, isActive, _id } = S.form
  if (!name?.trim()) { S.formError = 'Nome obrigatório.'; render(); return }
  try {
    await api(`/workspaces/${_id}`, { method:'PATCH', body: JSON.stringify({ name: name.trim(), isActive }) })
    await fetchWorkspaces()
    closeModal()
    showToast('Workspace atualizado')
  } catch(e) { S.formError = e.message; render() }
}

async function confirmDeleteWorkspace() {
  try {
    await api(`/workspaces/${S.deleteTarget.id}`, { method:'DELETE' })
    await fetchWorkspaces()
    closeModal()
    showToast('Workspace excluído')
  } catch(e) { S.formError = e.message; render() }
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app')
  if (S.view==='loading') { app.innerHTML=`<div class="min-h-screen flex items-center justify-center text-gray-400 text-sm">Carregando...</div>`; return }
  if (S.view==='setup' || S.view==='login') { app.innerHTML = renderAuth(); return }
  app.innerHTML = renderDashboard()
}

function renderAuth() {
  const isSetup = S.view === 'setup'
  return `
  <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center mx-auto mb-3">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <h1 class="text-xl font-bold text-gray-900">${isSetup ? 'Configuração Super Admin' : 'Super Admin'}</h1>
        <p class="text-sm text-gray-500 mt-1">${isSetup ? 'Crie a conta de super administrador' : 'Acesso restrito ao super administrador'}</p>
      </div>
      ${S.formError ? `<p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-4">${esc(S.formError)}</p>` : ''}
      <div class="space-y-3">
        ${isSetup ? `<div><label class="block text-xs font-semibold text-gray-600 mb-1">Nome</label>
          <input type="text" value="${esc(S.form.name||'')}" oninput="S.form.name=this.value" placeholder="Seu nome"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>` : ''}
        <div><label class="block text-xs font-semibold text-gray-600 mb-1">E-mail</label>
          <input type="email" value="${esc(S.form.email||'')}" oninput="S.form.email=this.value" placeholder="super@empresa.com"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>
        <div><label class="block text-xs font-semibold text-gray-600 mb-1">Senha</label>
          <input type="password" value="${esc(S.form.password||'')}" oninput="S.form.password=this.value"
            onkeydown="if(event.key==='Enter')${isSetup ? 'submitSetup()' : 'submitLogin()'}"
            placeholder="••••••••"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>
      </div>
      <button onclick="${isSetup ? 'submitSetup()' : 'submitLogin()'}" class="mt-5 w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-medium">
        ${isSetup ? 'Criar conta' : 'Entrar'}
      </button>
    </div>
  </div>`
}

function renderDashboard() {
  return `
  <div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <h1 class="font-bold text-gray-900">Super Admin</h1>
      </div>
      <button onclick="logout()" class="text-sm text-gray-500 hover:text-gray-700">Sair</button>
    </header>

    <!-- Content -->
    <main class="flex-1 p-6 max-w-5xl mx-auto w-full">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-gray-900">Workspaces <span class="text-sm font-normal text-gray-400">(${S.workspaces.length})</span></h2>
        <button onclick="openCreateWorkspace()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-medium">+ Novo Workspace</button>
      </div>

      ${S.workspaces.length === 0 ? `
        <div class="text-center py-16 text-gray-400">
          <p class="text-sm">Nenhum workspace criado ainda.</p>
        </div>` : `
        <div class="grid gap-4">
          ${S.workspaces.map(ws => renderWorkspaceCard(ws)).join('')}
        </div>`}
    </main>

    ${renderModal()}
    ${S.toast ? `<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg fade z-50">${esc(S.toast)}</div>` : ''}
  </div>`
}

function renderWorkspaceCard(ws) {
  const cnt = ws._count || {}
  const badgeClass = ws.isActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
  return `
  <div class="bg-white rounded-xl border border-gray-200 p-5 flex items-start justify-between gap-4">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 mb-1">
        <h3 class="font-semibold text-gray-900">${esc(ws.name)}</h3>
        <span class="text-xs px-2 py-0.5 rounded-full font-medium ${badgeClass}">${ws.isActive ? 'Ativo' : 'Inativo'}</span>
      </div>
      <p class="text-xs text-gray-400 font-mono mb-3">${esc(ws.slug)}</p>
      <div class="flex gap-4 text-xs text-gray-500">
        <span><strong class="text-gray-700">${cnt.leadUsers ?? 0}</strong> usuários</span>
        <span><strong class="text-gray-700">${cnt.leads ?? 0}</strong> leads</span>
        <span><strong class="text-gray-700">${cnt.connections ?? 0}</strong> conexões</span>
      </div>
    </div>
    <div class="flex gap-2 flex-shrink-0">
      <button onclick="accessWorkspace(${JSON.stringify(ws).replace(/"/g,'&quot;')})"
        class="px-3 py-1.5 text-xs font-medium bg-green-50 hover:bg-green-100 text-green-700 rounded-lg">Acessar</button>
      <button onclick="openWorkspaceUsers(${JSON.stringify(ws).replace(/"/g,'&quot;')})"
        class="px-3 py-1.5 text-xs font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg">Usuários</button>
      <button onclick="openEditWorkspace(${JSON.stringify(ws).replace(/"/g,'&quot;')})"
        class="px-3 py-1.5 text-xs font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg">Editar</button>
      ${ws.slug !== 'default' ? `<button onclick="openDeleteWorkspace(${JSON.stringify(ws).replace(/"/g,'&quot;')})"
        class="px-3 py-1.5 text-xs font-medium bg-red-50 hover:bg-red-100 text-red-700 rounded-lg">Excluir</button>` : ''}
    </div>
  </div>`
}

function renderModal() {
  if (!S.modal) return ''
  const overlay = `fixed inset-0 bg-black/40 flex items-center justify-center z-40 p-4`

  if (S.modal === 'create_ws') {
    return `<div class="${overlay}" onclick="if(event.target===this)closeModal()">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 fade">
        <h3 class="font-semibold text-gray-900 mb-4">Novo Workspace</h3>
        ${S.formError ? `<p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-4">${esc(S.formError)}</p>` : ''}
        <div class="space-y-3">
          <div><label class="block text-xs font-semibold text-gray-600 mb-1">Nome do Workspace</label>
            <input type="text" value="${esc(S.form.name||'')}" oninput="S.form.name=this.value" placeholder="Minha Empresa"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>
          <div><label class="block text-xs font-semibold text-gray-600 mb-1">Slug <span class="font-normal text-gray-400">(apenas letras minúsculas, números e hífens)</span></label>
            <input type="text" value="${esc(S.form.slug||'')}" oninput="S.form.slug=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')" placeholder="minha-empresa"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>
          <hr class="border-gray-100"/>
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Admin do Workspace</p>
          <div><label class="block text-xs font-semibold text-gray-600 mb-1">Nome do Admin</label>
            <input type="text" value="${esc(S.form.adminName||'')}" oninput="S.form.adminName=this.value" placeholder="Nome completo"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>
          <div><label class="block text-xs font-semibold text-gray-600 mb-1">E-mail do Admin</label>
            <input type="email" value="${esc(S.form.adminEmail||'')}" oninput="S.form.adminEmail=this.value" placeholder="admin@empresa.com"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>
          <div><label class="block text-xs font-semibold text-gray-600 mb-1">Senha do Admin</label>
            <input type="password" value="${esc(S.form.adminPassword||'')}" oninput="S.form.adminPassword=this.value" placeholder="••••••••"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>
        </div>
        <div class="flex gap-2 mt-5">
          <button onclick="closeModal()" class="flex-1 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Cancelar</button>
          <button onclick="submitCreateWorkspace()" class="flex-1 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-medium">Criar</button>
        </div>
      </div>
    </div>`
  }

  if (S.modal === 'edit_ws') {
    return `<div class="${overlay}" onclick="if(event.target===this)closeModal()">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 fade">
        <h3 class="font-semibold text-gray-900 mb-4">Editar Workspace</h3>
        ${S.formError ? `<p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-4">${esc(S.formError)}</p>` : ''}
        <div class="space-y-3">
          <div><label class="block text-xs font-semibold text-gray-600 mb-1">Nome</label>
            <input type="text" value="${esc(S.form.name||'')}" oninput="S.form.name=this.value"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400"/></div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="wsActive" ${S.form.isActive ? 'checked' : ''} onchange="S.form.isActive=this.checked" class="rounded"/>
            <label for="wsActive" class="text-sm text-gray-700">Workspace ativo</label>
          </div>
        </div>
        <div class="flex gap-2 mt-5">
          <button onclick="closeModal()" class="flex-1 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Cancelar</button>
          <button onclick="submitEditWorkspace()" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">Salvar</button>
        </div>
      </div>
    </div>`
  }

  if (S.modal === 'delete_ws') {
    const ws = S.deleteTarget
    return `<div class="${overlay}" onclick="if(event.target===this)closeModal()">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 fade">
        <h3 class="font-semibold text-gray-900 mb-2">Excluir Workspace</h3>
        <p class="text-sm text-gray-600 mb-4">Tem certeza que deseja excluir <strong>${esc(ws?.name)}</strong>? Esta ação não pode ser desfeita.</p>
        ${S.formError ? `<p class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-3">${esc(S.formError)}</p>` : ''}
        <div class="flex gap-2">
          <button onclick="closeModal()" class="flex-1 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Cancelar</button>
          <button onclick="confirmDeleteWorkspace()" class="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium">Excluir</button>
        </div>
      </div>
    </div>`
  }

  if (S.modal === 'view_users') {
    const ws = S.selectedWorkspace
    return `<div class="${overlay}" onclick="if(event.target===this)closeModal()">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 fade">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-gray-900">Usuários — ${esc(ws?.name)}</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        ${S.wsUsersLoading ? `<div class="py-8 text-center text-sm text-gray-400">Carregando...</div>` :
          S.wsUsers.length === 0 ? `<p class="text-sm text-gray-400 py-4 text-center">Nenhum usuário</p>` :
          `<div class="space-y-2 max-h-80 overflow-y-auto">
            ${S.wsUsers.map(u => `
              <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-gray-50">
                <div>
                  <p class="text-sm font-medium text-gray-900">${esc(u.name)}</p>
                  <p class="text-xs text-gray-500">${esc(u.email)}</p>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs px-2 py-0.5 rounded-full font-medium ${u.role==='ADMIN' ? 'bg-indigo-100 text-indigo-700' : 'bg-gray-100 text-gray-600'}">${u.role}</span>
                  ${!u.isActive ? `<span class="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-600">Inativo</span>` : ''}
                </div>
              </div>`).join('')}
          </div>`}
      </div>
    </div>`
  }

  return ''
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render()
boot()
</script>
</body>
</html>
